services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "__PORT__:__PORT__"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:

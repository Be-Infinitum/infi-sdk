                required: [revoked]
                properties:
                  revoked: {type: integer}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/customer-sessions/verify:
    get:
      tags: [customer_sessions]
      summary: Who a buyer token signs in, and what they have at this store
      x-infi-facade: true
      x-infi-scope: billing:read
      operationId: customer_sessions_verify
      description: >
        For the store's own server, with its `sk_`: the page holds the `bt_` (from the portal's code login or a merchant mint) and the server asks who it is before showing a gated page. `access` lists each product bought and not fully refunded or charged back (`purchase`), and each subscription still running (`subscription`: active, trialing or past_due). A token of another store answers 401 like any invalid one. A GET, so nothing caches it: every call reads the access as it is now.

      parameters:
        - name: X-Buyer-Token
          in: header
          required: true
          schema: {type: string, example: bt_…}
      responses:
        "200":
          description: The signed-in buyer
          content:
            application/json:
              schema:
                type: object
                required: [buyer, origin, scope, expiresAt, access]
                properties:
                  buyer:
                    type: object
                    required: [customerIds, externalIds]
                    properties:
                      email: {type: string}
                      name: {type: string}
                      customerIds: {type: array, items: {$ref: '#/components/schemas/CustomerId'}}
                      externalIds: {type: array, items: {type: string}}
                  origin: {type: string, enum: [code, merchant]}
                  scope: {type: string, enum: ["portal:read", "portal:write"]}
                  expiresAt: {type: string, format: date-time}
                  access:
                    type: array
                    items:
                      type: object
                      required: [productId, name, kind]
                      properties:
                        productId: {$ref: '#/components/schemas/ProductId'}
                        key: {type: string, description: "The manifest key, e.g. ecommerce/ebook"}
                        name: {type: string}
                        kind: {type: string, enum: [purchase, subscription]}
                        subscriptionStatus: {type: string, enum: [active, trialing, past_due]}
                        renewsAt: {type: string, format: date-time}
                        cancelAtPeriodEnd: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  requestBodies:
    Order:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids: {type: array, items: {type: string, format: uuid}}
  securitySchemes:
    receivingWebhookBasic:
      type: "http"
      scheme: "basic"
      description: "Dedicated webhook username and password for the Brazilian receiving ingress. Dashboard fields were inspected; real authenticated delivery remains an activation gate."
    buyerToken:
      type: http
      scheme: bearer
      description: >
        A buyer portal token (`bt_...`, ADR 0006): a 30-day session opened by a 6-digit code, or a 1-hour token your server minted with `POST /v1/customer-sessions`. Bound to one store.

    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A Pulse secret API key presented as `Authorization: Bearer sk_live_...`. Keys are hashed at rest and matched in constant time.

    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A verified CIAM session token (Clerk JWT) from dashboard login. Requires a linked users row. Pass `X-Tenant-Slug` when the operator belongs to multiple tenants.

    publishableKey:
      type: http
      scheme: bearer
      description: >
        A browser-safe publishable key (`pk_live_...`) for client-side SDK calls.

  headers:
    FacadeETag:
      description: The `draftHash`, quoted.
      schema: {type: string}
    FacadePlanETag:
      description: The `planHash`, quoted.
      schema: {type: string}
  parameters:
    FacadeDraftKey:
      name: draftKey
      in: path
      required: true
      description: A UUID the caller chooses. Saving again with it recovers a lost response.
      schema: {type: string, format: uuid}
    FacadeHash:
      name: hash
      in: query
      required: false
      description: The `draftHash` you hold. A different current hash answers 412.
      schema: {type: string}
    FacadeIfMatch:
      name: If-Match
      in: header
      required: true
      description: The `draftHash` you reviewed, quoted. Absent answers 428.
      schema: {type: string}
    FacadePlanHash:
      name: If-Match
      in: header
      required: true
      description: The `planHash` of the plan you reviewed, quoted. Absent answers 428.
      schema: {type: string}
    FacadeIfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The `draftHash` you reviewed, quoted. Absent only creates.
      schema: {type: string}
    FacadeChannel:
      name: X-Infi-Channel
      in: header
      required: false
      description: Where the approval came from. Recorded with it. Default `api`.
      schema: {type: string, enum: [panel, mcp, cli, api], default: api}
    BuyerActionGrant:
      name: X-Buyer-Action-Grant
      in: header
      required: false
      description: >
        The single-use grant from `/portal/action-codes/verify`. Required on a code session; ignored for a `portal:write` merchant token.

      schema: {type: string}
    PortalSlug:
      name: slug
      in: path
      required: true
      description: The store's (tenant's) slug.
      schema: {type: string}
    StatementFormat:
      name: format
      in: query
      required: false
      description: pdf (default) or csv.
      schema: {type: string, enum: [pdf, csv], default: pdf}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-supplied key for safe retries. The first response for a key is stored and replayed verbatim on any retry with the same key.

      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 0}
    FacadeLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1-100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    FacadeCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `nextCursor`.
      schema: {type: string}
    Offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0}
    PaySlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
      description: Tenant slug (`tenants.slug`), e.g. `app-aaadd389`.
    LinkToken:
      name: token
      in: path
      required: true
      schema: {type: string}
      description: >
        The payment link's opaque `plink_*` token. This IS the capability — holding it is the whole authorization, which is why these routes take no API key.

    SessionID:
      name: sessionID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductID:
      name: productID
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ProductId'}
    VersionID:
      name: versionID
      in: path
      required: true
      schema: {type: string, format: uuid}
    MeterID:
      name: meterID
      in: path
      required: true
      schema: {type: string, format: uuid}
    LinkID:
      name: linkID
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: >
        Payment link UUID. Revoke resolves the link by tenant + linkID only — the `productID` in the path is not used to scope it.

    CustomerID:
      name: customerID
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CustomerId'}
      description: Tenant customer UUID (customers.id).
    EnrollmentID:
      name: enrollmentID
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Product enrollment UUID (product_customers.id).
    LegacyEnrollmentID:
      name: customerID
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: |
        Product enrollment UUID (product_customers.id). Legacy SDK paths use this
        parameter name; subscriptions, invoices, and credit wallets reference enrollment IDs.
    SubscriptionID:
      name: subscriptionID
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SubscriptionId'}
    InvoiceID:
      name: invoiceID
      in: path
      required: true
      schema: {$ref: '#/components/schemas/InvoiceId'}
    PaymentID:
      name: paymentID
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PaymentId'}
    InstrumentID:
      name: instrumentID
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Stored payment method UUID (payment_instruments.id).
  responses:
    Statement:
      description: >
        The statement as a download (`Content-Disposition: attachment`, never cached).

      content:
        application/pdf:
          schema: {type: string, format: binary}
        text/csv:
          schema: {type: string, format: binary}
    PortalChallenge:
      description: A challenge was opened (a code is mailed only to a known address)
      content:
        application/json:
          schema:
            type: object
            required: [challengeId, expiresAt]
            properties:
              challengeId: {type: string, format: uuid}
              expiresAt: {type: string, format: date-time}
    BuyerToken:
      description: A portal token, shown once
      content:
        application/json:
          schema:
            type: object
            required: [token, expiresAt, origin, scope]
            properties:
              token: {type: string, example: bt_3f...}
              expiresAt: {type: string, format: date-time}
              origin: {type: string, enum: [code, merchant]}
              scope: {type: string, enum: ["portal:read", "portal:write"]}
    DraftChanged:
      description: >
        The draft is not the one you hold. Nothing was saved or published. `current` is the draft as it is now, null when it does not exist.

      content:
        application/json:
          schema:
            type: object
            required: [message, error_code, current]
            properties:
              message: {type: string}
              error_code: {type: string, enum: [draft_changed]}
              current:
                oneOf:
                  - {$ref: "#/components/schemas/FacadeProductDraft"}
                  - {$ref: "#/components/schemas/FacadeLinkDraft"}
                  - {type: "null"}
    PlanChanged:
      description: >
        The account is not the one the plan was computed against. Nothing was applied. `current` is the plan as it computes now (null if it cannot be computed); review it and apply that one.

      content:
        application/json:
          schema:
            type: object
            required: [message, error_code, current]
            properties:
              message: {type: string}
              error_code: {type: string, enum: [plan_changed]}
              current:
                oneOf:
                  - {$ref: "#/components/schemas/CompanyConfigPlan"}
                  - {type: "null"}
    IfMatchRequired:
      description: Publishing needs `If-Match` with the draft hash you reviewed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Authenticated but not allowed (e.g. no tenant membership)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NotFoundError"}
    Conflict:
      description: >
        Conflicting state. Two shapes: a handler conflict (ConflictError) or the Idempotency-Key replay guard, which is written by middleware and uses the nested envelope (MiddlewareError, `code: idempotency_key_reused`).

      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ConflictError"
              - $ref: "#/components/schemas/MiddlewareError"
    ValidationFailed:
      description: >
        One or more fields are invalid. The per-field detail is in `errors[]`; read it, the top-level `message` is often generic.

      content:
        application/json:
          schema: {$ref: "#/components/schemas/ValidationError"}
    ServiceUnavailable:
      description: A required dependency (e.g. object storage) is not configured
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: >
        Rate limit exceeded. Uses the nested middleware envelope, not the flat one. `Retry-After` gives the wait in seconds.

      headers:
        Retry-After:
          schema: {type: integer}
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MiddlewareError"}
    AccessRules:
      description: What buying the product grants
      content:
        application/json:
          schema:
            type: object
            required: [rules]
            properties:
              rules: {type: array, items: {$ref: "#/components/schemas/AccessRule"}}
  schemas:
    "ReceivingKycStatus":
      "type": "object"
      "additionalProperties": false
      "properties":
        "state":
          "type": "string"
          "enum":
            - "not_requested"
            - "queued"
            - "checking"
            - "issuing"
            - "ready"
            - "unavailable"
            - "outcome_unknown"
            - "expired"
            - "stale"
        "revision":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "receivingRevision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "serverTime":
          "type": "string"
          "format": "date-time"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "retryAfter":
          "type": "string"
          "format": "date-time"
        "reason":
          "type": "string"
      "required":
        - "state"
        - "revision"
        - "receivingRevision"
        - "serverTime"
    "ReceivingKycLink":
      "type": "object"
      "additionalProperties": false
      "properties":
        "url":
          "type": "string"
          "format": "uri"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "revision":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "receivingRevision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "serverTime":
          "type": "string"
          "format": "date-time"
      "required":
        - "url"
        - "expiresAt"
        - "revision"
        - "receivingRevision"
        - "serverTime"
    ReceivingAddress:
      type: "object"
      additionalProperties: false
      required:
        - "street"
        - "complementary"
        - "streetNumber"
        - "neighborhood"
        - "city"
        - "state"
        - "zipCode"
        - "referencePoint"
      properties:
        street:
          type: "string"
        complementary:
          type: "string"
        streetNumber:
          type: "string"
        neighborhood:
          type: "string"
        city:
          type: "string"
        state:
          type: "string"
        zipCode:
          type: "string"
        referencePoint:
          type: "string"
    ReceivingPhone:
      type: "object"
      additionalProperties: false
      required:
        - "areaCode"
        - "number"
        - "type"
      properties:
        areaCode:
          type: "string"
        number:
          type: "string"
        type:
          type: "string"
    ReceivingPerson:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "email"
        - "document"
        - "birthdate"
        - "professionalOccupation"
        - "monthlyIncome"
        - "address"
        - "phones"
      properties:
        name:
          type: "string"
        email:
          type: "string"
        document:
          type: "string"
        siteUrl:
          type: "string"
        motherName:
          type: "string"
        birthdate:
          type: "string"
        professionalOccupation:
          type: "string"
        monthlyIncome:
          type: "integer"
          format: "int64"
          minimum: 0
        address:
          $ref: "#/components/schemas/ReceivingAddress"
        phones:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/ReceivingPhone"
    ReceivingIndividual:
      allOf:
        - $ref: "#/components/schemas/ReceivingPerson"
        - type: object
          required: [siteUrl]
    ReceivingCompany:
      type: "object"
      additionalProperties: false
      required:
        - "companyName"
        - "tradingName"
        - "email"
        - "document"
        - "siteUrl"
        - "annualRevenue"
        - "address"
        - "phones"
        - "managingPartner"
      properties:
        companyName:
          type: "string"
        tradingName:
          type: "string"
        email:
          type: "string"
        document:
          type: "string"
        siteUrl:
          type: "string"
        corporationType:
          type: "string"
        foundingDate:
          type: "string"
        annualRevenue:
          type: "integer"
          format: "int64"
          minimum: 0
        address:
          $ref: "#/components/schemas/ReceivingAddress"
        phones:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/ReceivingPhone"
        managingPartner:
          $ref: "#/components/schemas/ReceivingPerson"
        selfDeclaredLegalRepresentative:
          type: "boolean"
    ReceivingBank:
      type: "object"
      additionalProperties: false
      required:
        - "holderName"
        - "holderType"
        - "holderDocument"
        - "bank"
        - "branchNumber"
        - "accountNumber"
        - "accountCheckDigit"
        - "type"
      properties:
        holderName:
          type: "string"
        holderDocument:
          type: "string"
        bank:
          type: "string"
        branchNumber:
          type: "string"
        branchCheckDigit:
          type: "string"
        accountNumber:
          type: "string"
        accountCheckDigit:
          type: "string"
        holderType:
          type: "string"
          enum:
            - "individual"
            - "company"
        type:
          type: "string"
          enum:
            - "checking"
            - "savings"
    ReceivingApplication:
      oneOf:
        - type: "object"
          additionalProperties: false
          required:
            - "individual"
            - "bank"
          properties:
            individual:
              $ref: "#/components/schemas/ReceivingIndividual"
            bank:
              $ref: "#/components/schemas/ReceivingBank"
        - type: "object"
          additionalProperties: false
          required:
            - "company"
            - "bank"
          properties:
            company:
              $ref: "#/components/schemas/ReceivingCompany"
            bank:
              $ref: "#/components/schemas/ReceivingBank"
      description: "Exactly one individual or company dossier, plus its bank account. Tenant, actor, provider code, environment and platform account are server-selected. The submitted dossier is immutable in this version."
    ReceivingView:
      type: "object"
      additionalProperties: false
      required:
        - "state"
        - "capabilities"
        - "updatedAt"
        - "receivingRevision"
      properties:
        receivingRevision:
          type: integer
          format: int64
          minimum: 1
        state:
          type: "string"
          enum:
            - "reserved"
            - "dispatched"
            - "linked"
            - "outcome_unknown"
            - "refused"
        recipientStatus:
          type: "string"
          enum:
            - "registration"
            - "affiliation"
            - "active"
            - "refused"
            - "suspended"
            - "blocked"
            - "inactive"
            - "unknown"
        kyc:
          type: "object"
          additionalProperties: false
          required:
            - "status"
          properties:
            status:
              type: "string"
              enum:
                - "pending"
                - "approved"
                - "denied"
                - "partially_denied"
                - "unknown"
            reason:
              type: "string"
        capabilities:
          type: "object"
          additionalProperties: false
          required:
            - "canTransact"
            - "canWithdraw"
            - "canRequestKyc"
          properties:
            canTransact:
              type: "boolean"
            canWithdraw:
              type: "boolean"
            canRequestKyc:
              type: "boolean"
        updatedAt:
          type: "string"
          format: "date-time"
      description: "Provider capabilities from the last applied snapshot, not Infi sale authorization or a guarantee of current provider standing. No dossier, bank data, provider IDs or credentials are returned."
    CompanyConfigReceipt:
      type: object
      required: [docHash, slug, sourceRevisionId, issuedAt, keyId, signature]
      properties:
        docHash: {type: string}
        slug: {type: string}
        sourceRevisionId: {type: string, example: crev_4Zc1nR2s6x8k0QwErTyUiO}
        issuedAt: {type: string, format: date-time}
        keyId: {type: string}
        signature: {type: string, description: "base64 Ed25519 over infi-config-promotion/v1, docHash, slug, sourceRevisionId, issuedAt (RFC 3339), newline-separated"}
    CompanyConfigActor:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [api_key, session], description: "api_key = an agent, the CLI or the MCP; session = a person."}
        id: {type: string, description: The key's id, or the address the person signed in with.: null}
    CompanyConfigRevision:
      type: object
      required: [id, number, status, mode, docHash, planHash, author, createdAt]
      properties:
        id: {type: string, example: crev_4Zc1nR2s6x8k0QwErTyUiO}
        number: {type: integer}
        status: {type: string, enum: [planned, applied, rejected, superseded]}
        mode: {type: string, enum: [sandbox, live]}
        docHash: {type: string}
        planHash: {type: string}
        author: {$ref: "#/components/schemas/CompanyConfigActor"}
        decidedBy: {$ref: "#/components/schemas/CompanyConfigActor"}
        baseRevisionId: {type: string}
        promotion: {$ref: "#/components/schemas/CompanyConfigReceipt"}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
    CompanyConfigRevisionDetail:
      allOf:
        - $ref: "#/components/schemas/CompanyConfigRevision"
        - type: object
          required: [document, options, plan]
          properties:
            document: {type: object}
            options: {$ref: "#/components/schemas/CompanyConfigOptions"}
            plan: {$ref: "#/components/schemas/CompanyConfigPlan"}
            current: {$ref: "#/components/schemas/CompanyConfigPlan"}
    CompanyConfigApplyResult:
      type: object
      required: [revision]
      properties:
        revision: {$ref: "#/components/schemas/CompanyConfigRevision"}
        approvalUrl: {type: string, description: "On live: where a person approves the proposal. It carries `?mode=live`, so the dashboard opens on the deployment the revision lives on."}
        secrets:
          type: array
          description: Signing secrets of the endpoints this apply created, shown once.
          items:
            type: object
            required: [url, secret]
            properties:
              url: {type: string}
              secret: {type: string}
    CompanyConfigOptions:
      type: object
      description: Part of the plan's hash; apply must send the same.
      properties:
        adoptUnmanaged: {type: boolean, description: Take over resources the document names that no revision wrote.}
        archiveOrphaned: {type: boolean, description: Archive managed resources the document no longer names. Nothing is deleted.}
        overwriteDrift: {type: boolean, description: Let the document win over edits made outside it.}
    CompanyConfigChange:
      type: object
      required: [action, resource, ref, key, sentence]
      properties:
        action: {type: string, enum: [create, update, bump, publish, skip, blocked, rename, archive]}
        resource: {type: string, enum: [product, meter, version, webhook]}
        ref: {type: string, description: "How the SDK names it: product name, name/meter, or URL."}
        key: {type: string, description: "Identity: product key, productKey/meterKey, or URL."}
        fields: {type: array, items: {type: string}}
        reason:
          type: string
          enum: [drift, unmanaged, immutable_field, active_subscriptions, selling_links, rename_conflict]
        from: {type: string, description: The key a renamed product had.}
        version:
          type: object
          required: [to, after]
          properties:
            from: {type: integer, description: The version buyers get now.}
            to: {type: integer}
            before: {type: object}
            after: {type: object}
            staying:
              type: array
              items:
                type: object
                required: [version, subscribers]
                properties:
                  version: {type: integer}
                  subscribers: {type: integer, format: int64}
        sentence: {type: string}
    CompanyConfigListed:
      type: object
      required: [resource, key, ref, sentence]
      properties:
        resource: {type: string}
        key: {type: string}
        ref: {type: string}
        sentence: {type: string}
    CompanyConfigPlan:
      type: object
      required: [docHash, stateHash, planHash, baseRevision, mode, options, hasChanges, blocked, changes, orphaned, unmanaged, drift]
      properties:
        docHash: {type: string}
        stateHash: {type: string}
        planHash: {type: string, description: What POST /config/apply takes.}
        baseRevision:
          type: object
          nullable: true
          properties:
            id: {type: string, example: crev_4Zc1nR2s6x8k0QwErTyUiO}
            number: {type: integer}
        mode: {type: string, enum: [sandbox, live]}
        options: {$ref: "#/components/schemas/CompanyConfigOptions"}
        hasChanges: {type: boolean}
        blocked: {type: boolean, description: A change waits on a decision; apply refuses a blocked plan.}
        changes: {type: array, items: {$ref: "#/components/schemas/CompanyConfigChange"}}
        orphaned: {type: array, items: {$ref: "#/components/schemas/CompanyConfigListed"}}
        unmanaged: {type: array, items: {$ref: "#/components/schemas/CompanyConfigListed"}}
        drift:
          type: array
          items:
            type: object
            required: [resource, key, sentence]
            properties:
              resource: {type: string, enum: [product, meter, terms, webhook]}
              key: {type: string}
              sentence: {type: string}
    # CompanyDocument and the Company* defs below are company.v1.json (the schema
    # GET /config/schema/v1.json serves) with its $defs moved to components, $ref
    # rewritten, and $schema/$id/title dropped. The if/then/else on the product
    # (billingCycle is required for subscription and prepaid, refused otherwise) is
    # kept as is: it is valid in OpenAPI 3.1 (JSON Schema 2020-12).
    CompanyDocument:
      description: 'Company as code (ADR 0025): the catalog and webhooks a tenant declares. POST /config/plan diffs it against the tenant; POST /config/apply applies the plan. Keys are identity: a product by key, a meter by key within its product, a webhook by URL. Money, identity, payout setup and secrets never go here.'
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - products
      properties:
        schemaVersion:
          const: 1
        products:
          type: array
          items:
            $ref: '#/components/schemas/CompanyProduct'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/CompanyWebhook'
    CompanyDecimal:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      description: A decimal number as a string; money is never a float.
    CompanyCurrency:
      type: string
      pattern: ^[A-Za-z]{3}$
      description: ISO 4217 code.
    CompanyProduct:
      type: object
      additionalProperties: false
      required:
        - key
        - type
        - pricingModel
      properties:
        key:
          type: string
          minLength: 1
          pattern: ^\S(.*\S)?$
          description: Stable natural key, unique per tenant. Also the name when no name is given.
        renamedFrom:
          type: string
          minLength: 1
          description: The key this product had before. A rename is explicit, never a delete and a create.
        name:
          type: string
        description:
          type: string
          description: Shown on the product page and the checkout.
        guaranteeDays:
          type: integer
          minimum: 7
          maximum: 30
          description: 'Refund window: a buyer''s refund asked inside it is automatic. Default 7.'
        type:
          enum:
            - agent
            - item
        pricingModel:
          enum:
            - subscription
            - one_time
            - usage
            - prepaid
        currency:
          $ref: '#/components/schemas/CompanyCurrency'
        billingCycle:
          enum:
            - weekly
            - monthly
            - annual
          description: Required for subscription and prepaid, refused otherwise.
        basePrice:
          $ref: '#/components/schemas/CompanyDecimal'
          description: The recurring or flat fee. Zero, or at least the minimum charge.
        meters:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMeter'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/CompanyPrice'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/CompanyGrant'
      allOf:
        - if:
            properties:
              pricingModel:
                enum:
                  - subscription
                  - prepaid
          then:
            required:
              - billingCycle
          else:
            not:
              required:
                - billingCycle
    CompanyMeter:
      type: object
      additionalProperties: false
      required:
        - key
        - unit
        - aggregation
      properties:
        key:
          type: string
          minLength: 1
          description: 'The slug track() sends. Immutable: renaming it would stop ingestion.'
        displayName:
          type: string
        unit:
          enum:
            - token
            - request
            - unit
        aggregation:
          enum:
            - sum
            - count
        valueProperty:
          type: string
    CompanyPrice:
      type: object
      additionalProperties: false
      required:
        - meter
        - model
      properties:
        meter:
          type: string
          minLength: 1
          description: Key of one of this product's meters. A flat amount is the product's basePrice, not a price.
        model:
          enum:
            - flat
            - per_unit
            - tiered
            - volume
            - package
        unitAmount:
          $ref: '#/components/schemas/CompanyDecimal'
        currency:
          $ref: '#/components/schemas/CompanyCurrency'
        tiers:
          type: array
    CompanyGrant:
      type: object
      additionalProperties: false
      required:
        - meter
        - amount
        - 'on'
      properties:
        meter:
          type: string
          pattern: ^[a-z0-9_]+$
        amount:
          $ref: '#/components/schemas/CompanyDecimal'
        'on':
          enum:
            - cycle
            - payment
    CompanyWebhook:
      type: object
      additionalProperties: false
      required:
        - url
        - events
      properties:
        url:
          type: string
          pattern: ^https://[^/\s]+
          description: Identity of the endpoint. Its signing secret is minted by the server and shown once.
        events:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: 'Event types. Not limited to a list: delivery matches by name.'
        isActive:
          type: boolean
    MfaDevice:
      type: object
      required: [id, name, status, createdAt, lastUsedAt]
      description: Seed-free projection of a registered authenticator.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [pending, active]}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, "null"], format: date-time}
    MfaEnrollment:
      type: object
      required: [deviceId, secret, otpauthUri, expiresAt]
      properties:
        deviceId: {type: string, format: uuid}
        secret: {type: string, description: The raw base32 TOTP seed. Shown once; never store it.}
        otpauthUri: {type: string, description: What the QR code encodes.}
        expiresAt: {type: string, format: date-time}
    MfaConfirmResult:
      type: object
      required: [device]
      properties:
        device: {$ref: "#/components/schemas/MfaDevice"}
        recoveryCodes:
          type: array
          items: {type: string}
          description: Only for the user's first active device.
    SearchResults:
      type: object
      required: [customers, products, invoices, payments, subscriptions]
      properties:
        customers:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: {type: string, example: cus_…}
              name: {type: string}
              email: {type: string}
              taxId: {type: string}
        products:
          type: array
          items:
            type: object
            required: [id, name, type, status]
            properties:
              id: {type: string, example: prod_…}
              name: {type: string}
              key: {type: string}
              type: {type: string}
              status: {type: string}
        invoices:
          type: array
          items:
            type: object
            required: [id, status, total, currency, createdAt]
            properties:
              id: {type: string, example: inv_…}
              number: {type: string}
              status: {type: string}
              total: {type: string}
              currency: {type: string}
              customerName: {type: string}
              customerEmail: {type: string}
              createdAt: {type: string, format: date-time}
        payments:
          type: array
          items:
            type: object
            required: [id, provider, method, status, amount, currency, createdAt]
            properties:
              id: {type: string, example: pay_…}
              provider: {type: string}
              method: {type: string}
              status: {type: string}
              amount: {type: string}
              currency: {type: string}
              createdAt: {type: string, format: date-time}
        subscriptions:
          type: array
          items:
            type: object
            required: [id, status, productName]
            properties:
              id: {type: string}
              status: {type: string}
              productName: {type: string}
              customerName: {type: string}
              customerEmail: {type: string}
              nextBillingDate: {type: string, format: date-time}
    NotificationDelivery:
      type: object
      required: [id, eventType, channel, destination, status, attempts, createdAt]
      properties:
        id: {type: string, format: uuid}
        eventType: {type: string}
        channel: {type: string}
        destination: {type: string}
        status: {type: string, description: "pending, sent or failed"}
        provider: {type: string}
        providerId: {type: string}
        error: {type: string, description: Why it failed; the answer to "why did my customer not get it".}
        attempts: {type: integer}
        createdAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time}
        customerId: {type: string, example: cus_…}
        dedupeKey: {type: string}
    CustomerId:
      type: string
      description: A customer's id. Starts with `cus_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^cus_[0-9A-Za-z]{22}$'
      example: cus_6Tq0Y2rGJ1aQ9zXk3LmPbV
    ProductId:
      type: string
      description: A product's id. Starts with `prod_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^prod_[0-9A-Za-z]{22}$'
      example: prod_1d4YogBuw00jAySh5mbUpk
    InvoiceId:
      type: string
      description: An invoice's id. Starts with `inv_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^inv_[0-9A-Za-z]{22}$'
      example: inv_6yi30EKotIwGHZdePSdsFc
    PaymentId:
      type: string
      description: A payment's id. Starts with `pay_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^pay_[0-9A-Za-z]{22}$'
      example: pay_585vbbvnwDyuyeA3MTOitd
    SubscriptionId:
      type: string
      description: A subscription's id. Starts with `sub_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^sub_[0-9A-Za-z]{22}$'
      example: sub_2Kp7rWqT0aLm4XcVb8NzJe
    CouponId:
      type: string
      description: A coupon's id. Starts with `coup_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^coup_[0-9A-Za-z]{22}$'
      example: coup_4Hn9sQ1vR7tY2uB0wE3iOa
    RefundId:
      type: string
      description: A refund's id. Starts with `re_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^re_[0-9A-Za-z]{22}$'
      example: re_7Gm2kP5xD9cF0jL3hN6qSb
    WebhookEndpointId:
      type: string
      description: A webhook endpoint's id. Starts with `we_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^we_[0-9A-Za-z]{22}$'
      example: we_3Tz8yU1oI4pA7sD0fG2hJk
    AccountId:
      type: string
      description: A business's (tenant's) id. Starts with `acct_`; the rest is 22 base62 characters. A bare UUID is still accepted as input while clients move over.
      pattern: '^acct_[0-9A-Za-z]{22}$'
      example: acct_4Lx2cV5bN8mQ1wE4rT7yUi
    PlatformFeatureCatalog:
      type: object
      required: [key, type, free, scale, action]
      properties:
        key: {type: string}
        type: {type: string, enum: [boolean, limit]}
        free: {}
        scale: {}
        meter: {type: string}
        action: {type: string, enum: [notify, overage, upgrade, block]}
    PlatformFeatureInput:
      type: object
      required: [key, type, free, scale, action]
      properties:
        key: {type: string}
        type: {type: string, enum: [boolean, limit]}
        free: {}
        scale: {}
        meterId: {type: [string, "null"], format: uuid}
        action: {type: string, enum: [notify, overage, upgrade, block]}
    CheckoutSession:
      type: object
      required: [merchant, invoice, testMode, paymentOptions, cardEnabled, acceptsPayments]
      properties:
        merchant:
          type: object
          required: [slug, name]
          properties:
            slug: {type: string}
            name: {type: string}
            logoUrl:
              type: string
              format: uri
              description: >
                Absent when the merchant has no logo. Absolute, on this API's host (`/pay/{slug}/logo/{file}`), immutable per upload.

        purchase: {$ref: '#/components/schemas/InvoicePurchase'}
        invoice: {$ref: "#/components/schemas/Invoice"}
        testMode: {type: boolean}
        paymentOptions:
          type: array
          items: {$ref: "#/components/schemas/PublicPaymentOption"}
        cardEnabled:
          type: boolean
          description: Compatibility projection derived from paymentOptions. Always present.
        legalSeller: {$ref: "#/components/schemas/LegalSellerView"}
        totals: {$ref: "#/components/schemas/CheckoutTotals"}
        autoTopupAvailable:
          type: boolean
          description: >
            True when the offer is a credit package (a one-off sale whose product grants credits when paid) and the UK Ltd collects it: the page may offer "automatic top-up", and the charge then takes `autoTopup: true` to save the card under the mandate. Always present.

        withdrawalWaiver: {$ref: "#/components/schemas/WithdrawalWaiver"}
        unavailableReason:
          type: string
          enum: [product_not_available, buyer_country_required, supplier_country_required, supplier_country_conflict, domestic_payments_unavailable, collection_unavailable, country_mismatch, invoice_not_payable, direct_collection_reconciliation_required]
          description: >
            Why this purchase cannot currently accept payment. Missing buyer country allows collecting contact first. Domestic BR card/Pix remains unavailable until Pagar.me dispatch is integrated, without UK fallback. Supplier country can also be missing/conflicting, or the product may still require UK approval (ADR 0026).

        acceptsPayments:
          type: boolean
          description: >
            False when the store cannot receive a payment yet (the UK Ltd has not admitted it): `paymentOptions` is then empty and the checkout says so instead of offering a method. Never omitted.

        paymentMethod:
          type: string
          enum: [pix, card]
          description: >
            Method of the confirmed payment. Present only once the invoice is paid (it drives the shared receipt); absent otherwise.

        mandate:
          type: object
          description: >
            Card-on-file authorization the payer must accept. Present only when card is available and the invoice is still open. `version` is what the client must echo as `consentTextVersion` when charging with `saveInstrument`.

          required: [version, text]
          properties:
            version: {type: string}
            text: {type: string}
        remember: {$ref: "#/components/schemas/CheckoutRememberOffer"}
    InvoicePurchase:
      description: Country and quote state for this purchase, independent of the customer profile.
      oneOf:
        - type: object
          required: [kind, revision]
          properties:
            kind: {type: string, enum: [country_required]}
            revision: {type: integer, format: int64, minimum: 0}
        - type: object
          required: [kind, revision, quoteId, consentDigest, buyerCountry]
          properties:
            kind: {type: string, enum: [quoted]}
            revision: {type: integer, format: int64, minimum: 1}
            quoteId: {type: string, format: uuid}
            consentDigest: {type: string}
            buyerCountry: {type: string}
            countryEditable:
              type: boolean
              description: False when a subscription renewal retains its original purchase country.
        - type: object
          required: [kind, revision, reason, countryEditable]
          properties:
            kind: {type: string, enum: [unavailable]}
            revision: {type: integer, format: int64, minimum: 0}
            buyerCountry: {type: string}
            reason: {type: string}
            countryEditable: {type: boolean}
        - type: object
          required: [kind, buyerCountry, countryEditable]
          properties:
            kind: {type: string, enum: [preserved]}
            buyerCountry: {type: string}
            countryEditable: {type: boolean, enum: [false]}
            payment: {$ref: '#/components/schemas/Payment'}
    MoneyMetric:
      type: object
      required: [value, delta]
      properties:
        value: {type: string}
        delta: {type: number}
    IntMetric:
      type: object
      required: [value, delta]
      properties:
        value: {type: integer}
        delta: {type: number}
    FloatMetric:
      type: object
      required: [value, delta]
      properties:
        value: {type: number}
        delta: {type: number}
    OverviewMetrics:
      type: object
      required: [revenue, mrr, arr, arpu, expansionRevenue, activeSubs, payingCustomers, tokensMetered, toolCalls, avgUsagePerAccount, nrr, churnRate, billingDisputes, daysToReconcile, chartData, activity]
      properties:
        revenue: {$ref: "#/components/schemas/MoneyMetric"}
        mrr: {$ref: "#/components/schemas/MoneyMetric"}
        arr: {$ref: "#/components/schemas/MoneyMetric"}
        arpu: {$ref: "#/components/schemas/MoneyMetric"}
        expansionRevenue: {$ref: "#/components/schemas/MoneyMetric"}
        activeSubs: {$ref: "#/components/schemas/IntMetric"}
        payingCustomers: {$ref: "#/components/schemas/IntMetric"}
        tokensMetered: {$ref: "#/components/schemas/MoneyMetric"}
        toolCalls: {$ref: "#/components/schemas/IntMetric"}
        avgUsagePerAccount: {$ref: "#/components/schemas/MoneyMetric"}
        nrr: {$ref: "#/components/schemas/FloatMetric"}
        churnRate: {$ref: "#/components/schemas/FloatMetric"}
        billingDisputes: {$ref: "#/components/schemas/IntMetric"}
        daysToReconcile: {$ref: "#/components/schemas/FloatMetric"}
        chartData:
          type: array
          items:
            type: object
            required: [date, revenue, tokens]
            properties:
              date: {type: string}
              revenue: {type: number}
              tokens: {type: number}
        activity:
          type: array
          items:
            type: object
            required: [id, action, source, time]
            properties:
              id: {type: string}
              action: {type: string}
              source: {type: string}
              time: {type: string}
    ClaimableTenantCreateResponse:
      type: object
      required: [id, status, tenantSlug, productId, apiKeySecret, publishableKey, accountName, claimUrl, expiresAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [UNCLAIMED, CLAIMED]}
        tenantSlug: {type: string}
        accountName: {type: string}
        productId:
          $ref: '#/components/schemas/ProductId'
          description: >
            The seeded "App usage" product. Provisioned unsellable on purpose — draft version 1, no key, no price — so publish a version and add a price before selling against it.

        apiKeySecret:
          type: string
          description: "`sk_test_*`, returned once and never again."
        publishableKey:
          type: string
          description: >
            An Infi `pk_test_` key, returned and RESERVED: **no route accepts it today.** Secret-key authentication rejects the `pk_` prefix outright, and nothing is mounted that takes one, so it authorizes nothing anywhere in this API. Never a payment-provider key.

            The embedded checkout needs no key at all — the `plink_` payment-link token is the capability. Do not build against this field yet.

        claimUrl:
          type: string
          format: uri
          description: >
            `{PULSE_APP_BASE_URL}/claim/{id}` — `https://app-sandbox.beinfi.com/claim/{id}` on the deployed sandbox.

        expiresAt:
          type: string
          format: date-time
          description: >
            When an unclaimed tenant is reclaimed and its `sk_test_` key revoked. 30 days out: claiming means signing in, which means leaving the editor, which is the one thing this door promises the developer they will not have to do — so the window has to outlive an absence (ADR 0056). The welcome email includes this deadline (ADR 0059).

    ClaimableTenantPublicView:
      type: object
      required: [id, status, tenantSlug, ref, expiresAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [UNCLAIMED, CLAIMED]}
        tenantSlug: {type: string}
        accountName: {type: string}
        productId: {$ref: '#/components/schemas/ProductId'}
        ref: {type: string, enum: [lovable, mcp, cursor, cli]}
        expiresAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time}
    ClaimTenantRequest:
      type: object
      description: >
        The claim flow's naming step. Both fields are optional and independent: a name alone derives the slug from it, a slug alone leaves the name as provisioned, neither leaves both alone.

      properties:
        accountName:
          type: string
          description: Display name for the account, replacing `New app`.
        slug:
          type: string
          description: >
            Lowercase alphanumeric words separated by single hyphens. Derived from `accountName` when omitted. Unique across the deployment — a slug already in use answers 409.

          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ClaimTenantResponse:
      type: object
      required: [tenantSlug, tenantId, onboardingStep]
      properties:
        tenantSlug: {type: string}
        tenantId: {$ref: '#/components/schemas/AccountId'}
        productId: {$ref: '#/components/schemas/ProductId'}
        onboardingStep:
          type: string
          description: >
            Same vocabulary as session sync, and the two must agree. A claimed tenant is named, so this is `complete`. Untyped until now, which is how it went on emitting `integrate` after that step was deleted.

          enum: [account, complete]
    # --- Error envelopes -------------------------------------------------
    # There are TWO shapes on the wire, and a client must handle both.
    #
    #   1. Error (flat, `tracer_id`) — everything a handler raises, i.e. every
    #      documented 4xx/5xx below. Written by internal/platform/httperror.
    #   2. MiddlewareError (nested under `error`, `request_id`) — written by
    #      internal/platform/middleware before a handler runs: 429 rate limit, the
    #      Idempotency-Key 409, and a transaction-wrapper 500. It cannot import
    #      httperror (import cycle), so it uses
    #      internal/platform/httperror/envelope instead.
    #
    # This divergence is pre-existing and load-bearing: clients already parse
    # `tracer_id`/`errors[]`, so the wire is the contract and this file follows it.
    # Do not "unify" by renaming a wire field — see .claude/rules/errors.md.
    ErrorCode:
      type: string
      description: >
        Stable internal domain code, append-only and never repurposed. NOT a closed set: alongside the generic codes below, packages define their own (`coupon_expired`, `insufficient_balance`, `version_not_draft`, `secret_store_unavailable`, `idempotency_key_reused`, and opaque ids such as `auth_001`). Treat an unrecognized code as its HTTP status and show `message`; never fail parsing on it.

      examples:
        - internal_error
        - validation_failed
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
    Error:
      type: object
      description: >
        The standard error body for anything a handler raises. Flat — there is no `error` wrapper — and the correlation id is `tracer_id`, not `request_id`.

      required: [message, error_code, tracer_id]
      properties:
        message:
          type: string
          description: Customer-safe sentence. Never contains internal detail.
        error_code: {$ref: "#/components/schemas/ErrorCode"}
        tracer_id:
          type: string
          description: >
            Request correlation id; quote it in a support request. Logged server-side as `request_id` against the line that explains the failure.

    ValidationError:
      type: object
      description: >
        422 body. Same flat shape as Error plus `errors[]`, the per-field detail — this array is where the actionable sentence lives (e.g. "product has no published version"), so a client that ignores it discards the fix.

      required: [message, error_code, tracer_id, errors]
      properties:
        message: {type: string}
        error_code: {$ref: "#/components/schemas/ErrorCode"}
        tracer_id: {type: string}
        errors:
          type: array
          description: Always present on a 422; may be empty.
          items:
            type: object
            required: [field, value, constraint, description]
            properties:
              field:
                type: string
                description: >
                  Request field (JSON name) at fault. Can name a logical input rather than a body key — e.g. `productId` for a path parameter.

              value:
                type: string
                description: Echoed offending value; empty string when not captured.
              constraint:
                type: string
                description: The rule that failed; currently mirrors `error_code`.
              description:
                type: string
                description: Customer-safe explanation of this field's problem.
    NotFoundError:
      type: object
      description: 404 body — Error plus the `resource` the lookup was for.
      required: [message, error_code, tracer_id, resource]
      properties:
        message: {type: string}
        error_code: {$ref: "#/components/schemas/ErrorCode"}
        tracer_id: {type: string}
        resource:
          type: string
          description: >
            Identifier of the missing resource, or an empty string when the handler did not attach one (common — do not depend on it).

    ConflictError:
      type: object
      description: 409 body from a handler — Error plus `resource` and `metadata`.
      required: [message, error_code, tracer_id, resource, metadata]
      properties:
        message: {type: string}
        error_code: {$ref: "#/components/schemas/ErrorCode"}
        tracer_id: {type: string}
        resource:
          type: string
          description: From `metadata.resource`; empty string when unset.
        metadata:
          type: ["object", "null"]
          additionalProperties: {type: string}
          description: Structured conflict context. `null` when the exception carried none.
    MiddlewareError:
      type: object
      description: >
        The middleware envelope — nested under `error`, correlation id named `request_id`. Emitted by 429 rate limiting, the Idempotency-Key 409, and a transaction-wrapper 500. A client parsing only the flat Error shape will read no message at all from these.

      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string}
            request_id: {type: string}
    ProductOfferAllowance:
      type: object
      required: [unit, quantity]
      additionalProperties: false
      properties:
        unit: {type: string, minLength: 1, maxLength: 100}
        quantity: {type: string, description: Positive whole quantity of service units.}
    ProductOfferUsage:
      type: object
      required: [unit, unitAmount, aggregation]
      additionalProperties: false
      properties:
        unit: {type: string, minLength: 1, maxLength: 100}
        unitAmount: {type: string, description: Nonnegative decimal with at most eight fractional places.}
        aggregation: {type: string, enum: [count, sum]}
        valueProperty:
          type: [string, "null"]
          description: Optional integration metadata. Metering sums each event's value; this does not extract an arbitrary JSON field.
    ProductOfferValues:
      type: object
      required: [name, pricingModel, currency]
      properties:
        name: {type: string, minLength: 2, maxLength: 255}
        description: {type: [string, "null"]}
        pricingModel: {type: string, enum: [one_time, subscription, usage]}
        currency: {type: string, enum: [BRL]}
        basePrice: {type: [string, "null"]}
        billingCycle: {type: [string, "null"], enum: [weekly, monthly, annual, null]}
        allowance:
          oneOf:
            - {$ref: "#/components/schemas/ProductOfferAllowance"}
            - {type: "null"}
        usage:
          oneOf:
            - {$ref: "#/components/schemas/ProductOfferUsage"}
            - {type: "null"}
    SaveProductOfferRequest:
      allOf:
        - {$ref: "#/components/schemas/ProductOfferValues"}
        - type: object
          properties:
            expectedRevision: {type: [string, "null"], format: uuid}
    PublishProductOfferRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: {type: string, format: uuid}
    ProductOffer:
      type: object
      required: [product, version, revision, published, offer]
      properties:
        product: {$ref: "#/components/schemas/Product"}
        version: {$ref: "#/components/schemas/Version"}
        revision: {type: string, format: uuid}
        published: {type: boolean}
        offer: {$ref: "#/components/schemas/ProductOfferValues"}
    FacadeProductDraft:
      type: object
      required: [draftKey, draftHash, published, product, version, offer]
      description: >
        A product draft as the public API serves it: the composer's offer with `draftHash` in place of its revision. `draftHash` is also the `ETag`; show it back in `If-Match` to save over or publish exactly this draft. Once published it keeps the hash its approver saw.

      properties:
        draftKey: {type: string, format: uuid}
        draftHash: {type: string}
        published: {type: boolean}
        product: {$ref: "#/components/schemas/Product"}
        version: {$ref: "#/components/schemas/Version"}
        offer: {$ref: "#/components/schemas/ProductOfferValues"}
    SaveLinkDraftRequest:
      type: object
      required: [product]
      description: >
        Body of `links_save_draft`. `product` names exactly one of `draftKey` and `productId`; `productVersionId` only goes with `productId`.

      properties:
        product:
          type: object
          properties:
            draftKey: {type: [string, "null"], format: uuid}
            productId: {oneOf: [{$ref: "#/components/schemas/ProductId"}, {type: "null"}]}
            productVersionId: {type: [string, "null"], format: uuid}
        successUrl: {type: [string, "null"]}
        cancelUrl: {type: [string, "null"]}
        appearance: {oneOf: [{$ref: "#/components/schemas/LinkAppearance"}, {type: "null"}]}
    FacadeLinkDraftProduct:
      type: object
      description: What the link draft sells. Either `draftKey` (with its `draftHash`) or `productId`.
      properties:
        draftKey: {type: string, format: uuid}
        draftHash: {type: string}
        productId: {$ref: "#/components/schemas/ProductId"}
        productVersionId: {type: string, format: uuid}
    FacadeLinkDraftPreview:
      type: object
      required: [name, amount, currency, paymentMethods]
      properties:
        name: {type: string}
        amount: {type: [string, "null"]}
        currency: {type: string}
        paymentMethods: {type: array, items: {type: string}}
    FacadeLinkDraft:
      type: object
      required: [draftKey, draftHash, published, product, preview, successUrl, cancelUrl, appearance, link]
      description: >
        A payment link draft. `draftHash` is also the `ETag`; it covers the product draft the link points at. `link` is null until published.

      properties:
        draftKey: {type: string, format: uuid}
        draftHash: {type: string}
        published: {type: boolean}
        product: {$ref: "#/components/schemas/FacadeLinkDraftProduct"}
        preview: {$ref: "#/components/schemas/FacadeLinkDraftPreview"}
        successUrl: {type: [string, "null"]}
        cancelUrl: {type: [string, "null"]}
        appearance: {$ref: "#/components/schemas/LinkAppearance"}
        link:
          oneOf:
            - {$ref: "#/components/schemas/PaymentLink"}
            - {type: "null"}
    Product:
      type: object
      required: [id, name, type, pricingModel, currency, status, guaranteeDays, accentColor, media, faq, purchaseButtonText, postPurchaseRedirectUrl, draftSavedAt, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ProductId'}
        key: {type: [string, "null"], description: "Stable per-tenant natural key (billing-as-code)."}
        name: {type: string}
        type: {type: string, enum: [agent, item]}
        description: {type: [string, "null"]}
        pricingModel:
          type: string
          enum: [subscription, one_time, usage, prepaid]
        currency: {type: string, example: BRL}
        status: {type: string, example: active}
        imageUrl:
          type: [string, "null"]
          description: Rendered address of the product photo, served by GET /public/media/{tenantID}/{file}.
        guaranteeDays:
          type: integer
          minimum: 7
          maximum: 30
          description: Refund window a portal ask resolves inside on its own.
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: >-
            This product's own accent, over the business theme (link > product > business). "" clears it on a write; null inherits.
        media:
          type: array
          items: {$ref: "#/components/schemas/ProductMedia"}
        faq:
          type: array
          items: {$ref: "#/components/schemas/ProductFAQ"}
        purchaseButtonText: {type: [string, "null"]}
        postPurchaseRedirectUrl: {type: [string, "null"]}
        draftSavedAt:
          type: [string, "null"]
          format: date-time
          description: The editor's last autosave of an unpublished draft; null when there is none.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateProductRequest:
      type: object
      required: [name, pricingModel]
      properties:
        guaranteeDays:
          type: integer
          minimum: 7
          maximum: 30
          description: >-
            Refund window: a buyer's refund asked from the portal inside it is automatic; after it, the store decides. 7 (the CDC floor) when absent.
        key:
          type: [string, "null"]
          description: >-
            Stable per-tenant natural key. Creating twice with the same key returns the same product rather than failing; pricing that differs from its current version is refused with 422 (`pricing_immutable`).
        name: {type: string}
        type: {type: string, enum: [agent, item]}
        description: {type: [string, "null"]}
        pricingModel:
          type: string
          enum: [subscription, one_time, usage, prepaid]
        currency: {type: string, example: BRL}
        billingCycle:
          type: [string, "null"]
          enum: [weekly, monthly, annual, null]
        basePrice: {type: [string, "null"]}
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: >-
            This product's own accent, over the business theme (link > product > business). "" clears it on a write; null inherits.
        media:
          type: array
          maxItems: 10
          items: {$ref: "#/components/schemas/ProductMedia"}
          description: Absent leaves the media; an empty list clears them.
        faq:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/ProductFAQ"}
          description: Absent leaves the FAQ; an empty list clears it.
        purchaseButtonText:
          type: [string, "null"]
          maxLength: 40
          description: The buy button's words. "" goes back to the element's default.
        postPurchaseRedirectUrl:
          type: [string, "null"]
          description: Absolute http(s) URL the buyer lands on after paying. A link's own successUrl wins over it. "" clears it.
    Version:
      type: object
      required: [id, productId, version, status, isDefault, commitmentResets]
      properties:
        id: {type: string, format: uuid}
        productId: {$ref: '#/components/schemas/ProductId'}
        version: {type: integer}
        billingCycle:
          type: [string, "null"]
          enum: [weekly, monthly, annual, null]
        basePrice: {type: [string, "null"]}
        status: {type: string, enum: [draft, published, archived]}
        isDefault:
          type: boolean
          description: >
            Among a product's published versions, whether this is the one a buyer gets when nothing names a specific version. A published version with `isDefault: false` is an offer reachable only by an explicit pin — a payment link created with `productVersionId` — which is how a product carries a promotional price without it reaching the shelf.

        publishedAt: {type: [string, "null"], format: date-time}
        commitmentAmount: {type: [string, "null"]}
        commitmentResets: {type: boolean}
        # Exposed here, like commitmentAmount, so the floor is visible in
        # GET .../versions without a second call to the consumption resource.
        consumptionFloor: {type: [string, "null"]}
        grants:
          type: array
          items: {$ref: "#/components/schemas/VersionGrant"}
    VersionGrant:
      type: object
      required: [meter, amount, on]
      properties:
        meter:
          type: string
          description: Catalog meter key (e.g. tokens). credits aliases the legacy CRD pool.
        amount:
          type: string
          description: Decimal string quantity to credit.
        on:
          type: string
          enum: [cycle, payment]
          description: cycle = period open/renew; payment = payment.confirmed.
    VersionConsumption:
      type: object
      description: >
        A version's unit-wallet configuration: which wallet each meter draws, what a unit of that wallet is worth in money, and the gate's floor.

      required: [rates, unitPrices]
      properties:
        floor:
          type: [string, "null"]
          description: >-
            Balance below which usage ingestion is refused, as a decimal string. 0 cuts when the wallet empties, a negative value grants that many units of grace, and null never cuts — the deficit is billed as overage at cycle close instead.
        rates:
          type: array
          items: {$ref: "#/components/schemas/ConsumptionRate"}
        unitPrices:
          type: array
          items: {$ref: "#/components/schemas/WalletUnitPrice"}
    VersionConsumptionInput:
      type: object
      description: >
        Complete replacement of the version's consumption configuration. An omitted or empty rates/unitPrices array clears it.

      properties:
        floor:
          type: [string, "null"]
          description: Decimal string, at most 8 decimal places. Null never cuts.
        rates:
          type: array
          items: {$ref: "#/components/schemas/ConsumptionRate"}
        unitPrices:
          type: array
          items: {$ref: "#/components/schemas/WalletUnitPrice"}
    ConsumptionRate:
      type: object
      description: >
        How usage of one meter becomes a wallet debit: quantity x factor, in units, with no rating and no currency. Flat by design — a tiered rate would make the debit non-incremental.

      required: [meterId, factor]
      properties:
        meterId:
          type: string
          format: uuid
          description: A meter on this product.
        drawsFrom:
          type: [string, "null"]
          format: uuid
          description: >-
            The meter whose balance this one spends. OMIT IT for the common case: absent means the meter draws its own balance, which is what "10 images included per month" is. Set it only for a shared pool, where several meters spend one balance at different factors. A meter cannot draw its own balance explicitly (ADR 0054).
        factor:
          type: string
          description: >-
            Wallet units drawn per metered unit: a positive decimal string with at most 8 decimal places. 1 means the meter draws its own wallet one for one.
    WalletUnitPrice:
      type: object
      description: >
        What one unit of a wallet is worth in money. Used only to turn a cycle-close deficit into an invoice line; absent means the deficit is neither billed nor cleared.

      required: [meterId, unitAmount]
      properties:
        meterId:
          type: string
          format: uuid
          description: The meter whose balance is being priced.
        unitAmount:
          type: string
          description: Positive decimal string, at most 8 decimal places.
        currency:
          type: string
          example: BRL
          description: 3-letter ISO 4217 code. Defaults to the product's currency.
    WebhookEventType:
      type: string
      description: >
        Event types emitted to the outbox and therefore deliverable to a webhook endpoint. This documents the set with a described payload — it does NOT restrict what an endpoint may subscribe to (see WebhookEndpoint.events), and it is deliberately NOT exhaustive: the outbox also carries payout.*, plan.*, account.* and reconciliation.* families. Each value listed here was verified against its emit site in internal/.

      enum:
        - checkout.session.created
        - checkout.session.completed
        - checkout.session.expired
        - customer.created
        - customer.converted
        - invoice.finalized
        - invoice.sent
        - invoice.paid
        - invoice.voided
        - invoice.uncollectible
        - invoice.auto_collection_failed
        - payment.confirmed
        - payment.failed
        - payment.refunded
        - payment.refund_reversed
        - payment.chargeback
        - payment.chargeback_reversed
        - plan.changed
        - usage.threshold_reached
        - credit.balance_low
        - credit.balance_depleted
        - subscription.cancel_scheduled
        - subscription.cancel_unscheduled
        - subscription.canceled
        - subscription.past_due
        - refund_request.created
        - payment.duplicate_detected
        - payment.duplicate_refunded
        - refund_request.declined
    SubscriptionPastDueData:
      type: object
      description: >
        Body of subscription.past_due. The subscription became overdue and its first overdue notice was durably requested in the same transaction. This event does not assert that the email was delivered.

      required: [subscriptionId, invoiceId]
      properties:
        subscriptionId: {$ref: '#/components/schemas/SubscriptionId'}
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
    CustomerConvertedData:
      type: object
      description: >
        Body of customer.converted. A confirmed payment converted this tenant customer. Emitted once on the lead-to-converted transition in the same transaction. Refunds and cancellation do not demote the customer. A merge may carry a historical conversion whose exact time is unknown.

      required: [customerId, externalId, paymentId, convertedAt]
      properties:
        customerId: {$ref: '#/components/schemas/CustomerId'}
        externalId: {type: string}
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        convertedAt: {type: [string, "null"], format: date-time}
    CustomerCreatedData:
      type: object
      description: Body of customer.created.
      required: [customerId, externalId, createdAt, stage]
      properties:
        customerId: {$ref: '#/components/schemas/CustomerId'}
        externalId: {type: string, description: "Your own user id for this customer."}
        createdAt: {type: string, format: date-time}
        stage: {type: string, enum: [lead, converted]}
        phone: {type: string}
        name: {type: string}
        email: {type: string}
        taxId: {type: string}
        country: {type: string}
    InvoiceAmountData:
      type: object
      description: Body of invoice.finalized and invoice.sent.
      required: [invoiceId, total, currency]
      properties:
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
        total: {type: string, description: "Decimal string."}
        currency: {type: string}
    InvoicePaidData:
      type: object
      description: >
        Body of invoice.paid — the invoice settled. No paymentId: an invoice can settle across more than one payment.

      required: [invoiceId, amount, currency]
      properties:
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
        amount: {type: string, description: "Decimal string."}
        currency: {type: string}
        customerId:
          type: string
          format: uuid
          description: "Product enrollment billed. Absent on ad-hoc invoices."
        payerId:
          $ref: '#/components/schemas/CustomerId'
          description: "Tenant-level customer. Absent on subscription invoices."
        outOfBand:
          type: boolean
          description: "True when the merchant marked it paid outside Infi; no payment ran."
        reason:
          type: string
          description: "The merchant's note on an out-of-band settlement."
    InvoiceRefData:
      type: object
      description: Body of invoice.voided and invoice.uncollectible.
      required: [invoiceId]
      properties:
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
    PaymentConfirmedData:
      type: object
      description: Body of payment.confirmed.
      required: [paymentId, invoiceId, amount, currency]
      properties:
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
        amount: {type: string, description: "Decimal string."}
        currency: {type: string}
        customerId:
          type: string
          format: uuid
          description: "Product enrollment billed. Absent on ad-hoc invoices."
        payerId:
          $ref: '#/components/schemas/CustomerId'
          description: "Tenant-level customer. Absent on subscription invoices."
    PaymentFailedData:
      type: object
      description: Body of payment.failed.
      required: [paymentId, invoiceId]
      properties:
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
    PaymentReversedData:
      type: object
      description: >
        Body of payment.refunded and payment.chargeback. accessRevoked says whether the buyer's deliverable download grants were cut, so a merchant can mirror the decision in its own entitlements.

      required: [paymentId, invoiceId, amount, currency, accessRevoked]
      properties:
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
        amount: {type: string, description: "Decimal string."}
        currency: {type: string}
        accessRevoked: {type: boolean}
    PlanChangedData:
      type: object
      description: >
        Body of plan.changed — a subscription's plan change took effect. Plans are named by their public key and version, never by id. effectiveAt is when the new plan starts rating the subscription: for an upgrade, the top of the hour it was requested in, announced at once; for any other change, the end of the period it was requested in, announced when that period closes. from is null when the subscription had no plan before (a move off the model before plans, which takes effect at a period boundary like any scheduled change).

      required: [subscriptionId, from, to, effectiveAt]
      properties:
        subscriptionId: {$ref: '#/components/schemas/SubscriptionId'}
        from:
          oneOf:
            - {$ref: "#/components/schemas/PlanIdentity"}
            - {type: "null"}
        to: {$ref: "#/components/schemas/PlanIdentity"}
        effectiveAt: {type: string, format: date-time}
    PlanIdentity:
      type: object
      required: [key, version]
      properties:
        key: {type: string}
        version: {type: integer}
    WalletMutationRequest:
      type: object
      required: [meter, amount]
      properties:
        meter: {type: string}
        amount: {type: string, description: Decimal string.}
        reason: {type: [string, "null"]}
        idempotencyKey:
          type: [string, "null"]
          description: When set, the mutation is idempotent under this key.
        reference:
          type: [string, "null"]
          description: Free-form reference alias (not deduped). Prefer idempotencyKey.
    ServiceUseRequest:
      type: object
      additionalProperties: false
      required: [commandId, meter, quantity, note]
      properties:
        commandId: {type: string, format: uuid}
        meter: {type: string}
        quantity: {type: string, pattern: '^[0-9]+(\.[0-9]{1,8})?$'}
        note: {type: string}
    ServiceUseCorrectionRequest:
      type: object
      additionalProperties: false
      required: [commandId, reason]
      properties:
        commandId: {type: string, format: uuid}
        reason: {type: string, minLength: 1}
    ServiceUseActor:
      type: object
      required: [type, id, label]
      properties:
        type: {type: string, enum: [user, api_key]}
        id: {type: string}
        label: {type: string}
    ServiceUseCorrection:
      type: object
      required: [id, commandId, serviceUseId, quantity, reason, source, actor, createdAt]
      properties:
        id: {type: string, format: uuid}
        commandId: {type: string, format: uuid}
        serviceUseId: {type: string, format: uuid}
        quantity: {type: string}
        reason: {type: string}
        source: {type: string, enum: [dashboard, api]}
        actor: {$ref: "#/components/schemas/ServiceUseActor"}
        createdAt: {type: string, format: date-time}
    ServiceUse:
      type: object
      required: [id, commandId, enrollmentId, meter, quantity, note, source, actor, createdAt, correction]
      properties:
        id: {type: string, format: uuid}
        commandId: {type: string, format: uuid}
        enrollmentId: {type: string, format: uuid}
        meter: {type: string}
        quantity: {type: string}
        note: {type: string}
        source: {type: string, enum: [dashboard, api]}
        actor: {$ref: "#/components/schemas/ServiceUseActor"}
        createdAt: {type: string, format: date-time}
        correction:
          oneOf:
            - {$ref: "#/components/schemas/ServiceUseCorrection"}
            - {type: "null"}
    ServiceUseBalance:
      type: object
      required: [meter, balance]
      properties:
        meter: {type: string}
        balance: {type: string}
    ServiceUsePermissions:
      type: object
      required: [canRecord, canCorrect]
      properties:
        canRecord: {type: boolean}
        canCorrect: {type: boolean}
    ServiceUseResult:
      type: object
      required: [use, balance]
      properties:
        use: {$ref: "#/components/schemas/ServiceUse"}
        balance: {$ref: "#/components/schemas/ServiceUseBalance"}
    ServiceUseCorrectionResult:
      type: object
      required: [correction, balance]
      properties:
        correction: {$ref: "#/components/schemas/ServiceUseCorrection"}
        balance: {$ref: "#/components/schemas/ServiceUseBalance"}
    ServiceUseHistory:
      type: object
      required: [items, balances, permissions, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ServiceUse"}}
        balances: {type: array, items: {$ref: "#/components/schemas/ServiceUseBalance"}}
        permissions: {$ref: "#/components/schemas/ServiceUsePermissions"}
        nextCursor:
          oneOf:
            - {type: string}
            - {type: "null"}
    WalletBalance:
      type: object
      required: [meter, balance, total]
      properties:
        meter: {type: string}
        balance: {type: string}
        total: {type: string, description: Lifetime credited total for this meter.}
    PutTopupPolicyRequest:
      type: object
      additionalProperties: false
      required: [meter, threshold, quantity]
      properties:
        meter: {type: string, description: A meter the customer's product declares.}
        threshold: {type: string, description: "Buy when the balance falls below this many units (decimal, 0 or more)."}
        quantity: {type: string, description: "Units bought each time (decimal, more than 0)."}
        maxPerDay:
          type: integer
          minimum: 1
          maximum: 10
          description: Most top-ups a day. Defaults to 3.
    TopupPolicy:
      type: object
      required: [meter, threshold, quantity, maxPerDay, quote, status, pausedReason, lastTopupAt]
      properties:
        meter: {type: string}
        threshold: {type: string}
        quantity: {type: string}
        maxPerDay: {type: integer}
        quote:
          description: What one top-up costs now. Null when the unit's price was withdrawn.
          oneOf:
            - $ref: "#/components/schemas/TopupQuote"
            - type: "null"
        status: {type: string, enum: [active, paused]}
        pausedReason:
          type: [string, "null"]
          description: Why it stopped, e.g. `charge_refused` (the bank refused the card).
        lastTopupAt: {type: [string, "null"], format: date-time}
    TopupQuote:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: string, description: Decimal with 2 places.}
        currency: {type: string}
    TopupMeter:
      type: object
      required: [meter, unitPrice, currency, discountPercent]
      description: A meter of the product that can carry a top-up, with what one unit costs.
      properties:
        meter: {type: string}
        unitPrice: {type: string}
        currency: {type: string}
        discountPercent: {type: string, description: The active plan's permanent top-up discount, 0 to 100.: null}
    TopupPolicies:
      type: object
      required: [policies, meters, minimumPurchase, cardOnFile]
      properties:
        policies:
          type: array
          items: {$ref: "#/components/schemas/TopupPolicy"}
        meters:
          type: array
          items: {$ref: "#/components/schemas/TopupMeter"}
        minimumPurchase: {type: string, description: The least a top-up may be worth, in the unit's currency.: null}
        cardOnFile: {type: boolean, description: The payer has a card saved on a UK account.}
    WalletBalances:
      type: object
      required: [balances]
      properties:
        balances:
          type: array
          items: {$ref: "#/components/schemas/WalletBalance"}
    Meter:
      type: object
      required: [id, productId, name, displayName, unit, aggregation, status]
      properties:
        id: {type: string, format: uuid}
        productId: {$ref: '#/components/schemas/ProductId'}
        name: {type: string, description: "Slug used by track()."}
        displayName: {type: string}
        unit: {type: string, enum: [token, request, unit]}
        aggregation:
          type: string
          enum: [sum, count, unique_count, max, last]
          description: >
            Billing sums each event's `value` (a missing value counts as 1, which is what `count` relies on). Only `sum` and `count` can be created; `unique_count`, `max` and `last` appear only on meters created before they were refused, and those bill as a sum.

        valueProperty:
          type: [string, "null"]
          description: "Stored as given; billing does not read it."
        status: {type: string}
    PaymentLink:
      type: object
      required: [id, productId, token, active, appearance, createdAt]
      description: >
        A product-bound, reusable, revocable payment link. `token` is a capability, not a credential — anyone holding it can open the checkout, which is the point. It is returned in full on every read because a link is meant to be copied and shared.

      properties:
        id: {type: string, format: uuid}
        productId: {$ref: '#/components/schemas/ProductId'}
        token:
          type: string
          description: "Opaque public token; the payer URL is /pay/{tenantSlug}/links/{token}."
        url:
          type: string
          description: >
            The payer-facing address, built server-side. Present so no caller has to re-supply the tenant slug the server already stores in order to learn where to send someone.

        productVersionId:
          type: [string, "null"]
          format: uuid
          description: >
            The product version this link sells, fixed when the link was created. Publishing a new version never reprices a link already issued. Null on links created before pinning existed: those resolve the latest published version at pay time.

        active: {type: boolean}
        appearance: {$ref: "#/components/schemas/LinkAppearance"}
        revokedAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
        successUrl:
          type: [string, "null"]
          description: >
            Where the hosted checkout sends the payer after paying, with `?status=success&invoice=…` appended. Stamped onto the invoice the link materializes.

        cancelUrl:
          type: [string, "null"]
          description: >
            Offered to the payer as "back to the merchant" while the checkout is open, and used by the embed as the `?status=error` destination when the charge expires.

    PublishVersionRequest:
      type: object
      description: >
        Optional. Omit the body to publish the ordinary way.

      properties:
        default:
          type: boolean
          default: true
          description: >
            True (or omitted) makes this the product's default version. False publishes it as an offer, sellable only by a link that names it.

    CreatePaymentLinkRequest:
      type: object
      description: >
        Optional. A link needs no configuration; send a body only to set where the payer goes afterwards. Both URLs must be absolute http(s).

      properties:
        successUrl: {type: [string, "null"], maxLength: 2048}
        cancelUrl: {type: [string, "null"], maxLength: 2048}
        productVersionId:
          type: [string, "null"]
          format: uuid
          description: >
            Sell a specific published version instead of the product's default. This is how a promotional price reaches a buyer: the version is published but not default, so nothing resolves into it by accident and only a link that names it can sell it.


            Omit for the default version, which is what an ordinary link sells. Refused if the version is not a published version of this product.

        appearance: {$ref: "#/components/schemas/LinkAppearance"}
    InlineProductSpec:
      type: object
      description: >
        A product defined inline on a link create, resolved by its natural `key`. A new key creates the product; a known key reuses it, and pricing that differs from the current version publishes a NEW version. That bump is safe because the link created here pins the version it got, so links already in circulation keep selling what they advertised.

      required: [key, pricingModel]
      properties:
        key:
          type: string
          description: >
            Stable per-tenant natural key. Required — it is what makes creating a link for the same product twice resolve to one product, not two.

        name:
          type: string
          description: "Display name. Defaults to `key` when omitted."
        type: {type: string, enum: [agent, item]}
        description: {type: [string, "null"]}
        pricingModel: {type: string, enum: [subscription, one_time, usage, prepaid]}
        currency: {type: string, minLength: 3, maxLength: 3}
        billingCycle:
          type: [string, "null"]
          enum: [weekly, monthly, annual, null]
          description: "Required for subscription/prepaid, optional for usage, forbidden for one_time."
        basePrice:
          type: [string, "null"]
          description: "Decimal string. Money never crosses the wire as a float."
        meters:
          type: array
          description: >
            Meters defined on the product, created once by name. An existing meter is never rewritten: its `name` is the key `track()` ingests against and its `aggregation` decides how past events were counted, so changing either here would retroactively alter what recorded usage meant.

          items: {$ref: "#/components/schemas/InlineMeterSpec"}
        prices:
          type: array
          description: >
            Prices on the version being published, declared in full. A set that differs from what the current version carries publishes a NEW version, the same as a differing `basePrice` — pricing is immutable once published. Omit the field entirely to say nothing about prices; an empty array means "no prices".

          items: {$ref: "#/components/schemas/InlinePriceSpec"}
    InlineMeterSpec:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "Slug `track()` sends against. Immutable once created."
        displayName: {type: string}
        unit: {type: string, enum: [token, request, unit]}
        aggregation:
          type: string
          enum: [sum, count]
          default: sum
          description: "`sum` bills the sum of the events' `value`; `count` bills the number of events, whatever `value` they carry. Anything else is refused with 422 `meter_aggregation_unsupported`."
        valueProperty:
          type: [string, "null"]
          description: "Optional and stored as given; billing reads the event's own `value`."
    InlinePriceSpec:
      type: object
      required: [meter, model]
      properties:
        meter:
          type: string
          description: >
            The meter this price rates, by slug. Required — a price with no meter is the product's `basePrice`, and two ways to say the same thing lets a product disagree with itself.

        model: {type: string, enum: [flat, per_unit, tiered, volume, package]}
        unitAmount: {type: [string, "null"], description: "Decimal string."}
        tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTier"}
          description: "Tiers for tiered/volume/package, validated as on createPrice."
        currency: {type: string, minLength: 3, maxLength: 3}
    CreatePaymentLinkWithProductRequest:
      type: object
      required: [product]
      properties:
        product: {$ref: "#/components/schemas/InlineProductSpec"}
        successUrl: {type: [string, "null"], maxLength: 2048}
        cancelUrl: {type: [string, "null"], maxLength: 2048}
    CreateMeterRequest:
      type: object
      required: [name, displayName, unit]
      properties:
        name: {type: string}
        displayName: {type: string}
        unit: {type: string, enum: [token, request, unit]}
        aggregation:
          type: string
          enum: [sum, count]
          default: sum
          description: >
            `sum` bills the sum of each event's `value` (a missing value counts as 1); `count` bills the number of events, whatever `value` they carry. `unique_count`, `max` and `last` are refused with 422 `meter_aggregation_unsupported`.

        valueProperty:
          type: [string, "null"]
          description: "Optional and stored as given; billing does not read it."
    UpdateMeterRequest:
      type: object
      description: "Mutable meter fields; omitted fields are unchanged. `name` is immutable."
      properties:
        displayName: {type: string}
        unit: {type: string, enum: [token, request, unit]}
        aggregation:
          type: string
          enum: [sum, count]
          description: >
            Switching to any other aggregation is refused with 422 `meter_aggregation_unsupported`. A meter created before that refusal keeps its stored aggregation when this field is omitted.

    Deliverable:
      type: object
      required: [id, productId, kind, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        productId: {$ref: '#/components/schemas/ProductId'}
        kind: {type: string, enum: [file, link]}
        fileName: {type: [string, "null"]}
        contentType: {type: [string, "null"]}
        sizeBytes: {type: [integer, "null"], format: int64}
        url: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PresignDeliverableRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
    PresignDeliverableResponse:
      type: object
      required: [uploadUrl, objectKey, expiresAt]
      properties:
        uploadUrl: {type: string}
        objectKey: {type: string}
        expiresAt: {type: string, format: date-time}
    PutDeliverableRequest:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [file, link]}
        objectKey: {type: [string, "null"]}
        fileName: {type: [string, "null"]}
        contentType: {type: [string, "null"]}
        sizeBytes: {type: [integer, "null"], format: int64}
        url: {type: [string, "null"]}
    PriceInput:
      type: object
      required: [meterId, model]
      properties:
        meterId:
          type: string
          format: uuid
          description: >
            The meter this price rates. Required and non-null — a price IS a meter rate. A flat recurring amount is not a price: it lives on the version's `basePrice` (ADR 0017 removed meterless prices). Must name a meter on the same product.

        model:
          type: string
          enum: [flat, per_unit, tiered, volume, package]
        unitAmount: {type: [string, "null"]}
        tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTier"}
          description: >
            Graduated/volume/package tiers, checked with the rules billing rates them by: at least one tier for `tiered`/`volume`/`package`, a positive `size` on a package's first tier, and every amount a decimal string. Anything else is 422 on `tiers`.

          default: []
        currency:
          type: string
          example: BRL
          description: Optional — defaults to the product's currency.
    PriceTier:
      type: object
      required: [unitAmount]
      properties:
        upTo:
          type: [string, "null"]
          description: "Inclusive cumulative upper bound, decimal string. Absent or null: the unbounded last band."
        unitAmount: {type: string, description: "Decimal string. Required."}
        flatAmount: {type: [string, "null"], description: "Decimal string added when the band is used."}
        size: {type: [string, "null"], description: "Units per package; package model only."}
    Price:
      type: object
      required: [id, productVersionId, model, tiers, currency]
      properties:
        id: {type: string, format: uuid}
        productVersionId: {type: string, format: uuid}
        meterId: {type: [string, "null"], format: uuid}
        model:
          type: string
          enum: [flat, per_unit, tiered, volume, package]
        unitAmount: {type: [string, "null"]}
        tiers:
          type: array
          items: {type: object, additionalProperties: true}
        currency: {type: string}
    RateCardInput:
      type: object
      required: [meterId, model]
      properties:
        meterId:
          type: [string, "null"]
          format: uuid
          description: Null targets the recurring base fee; that override must use model flat.
        model:
          type: string
          enum: [flat, per_unit, tiered, volume, package]
        unitAmount: {type: [string, "null"]}
        tiers:
          default: []
        currency:
          type: string
          example: BRL
    RateCard:
      type: object
      required: [id, customerId, model, tiers, currency]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        meterId: {type: [string, "null"], format: uuid}
        model:
          type: string
          enum: [flat, per_unit, tiered, volume, package]
        unitAmount: {type: [string, "null"]}
        tiers:
          type: array
          items: {type: object, additionalProperties: true}
        currency: {type: string}
    CustomerSummary:
      type: object
      required: [total, leads, converted]
      properties:
        total: {type: integer, format: int64}
        leads: {type: integer, format: int64}
        converted: {type: integer, format: int64}
    Customer:
      type: object
      required: [id, externalId, stage, convertedAt, conversionPaymentId, createdAt]
      description: Tenant-level end payer (unique externalId per tenant).
      properties:
        id: {$ref: '#/components/schemas/CustomerId'}
        externalId: {type: string}
        stage: {type: string, enum: [lead, converted]}
        convertedAt:
          type: [string, "null"]
          format: date-time
          description: Earliest evidenced dated confirmation time in system processing time. Null for leads and historical conversions with no reliable timestamp.
        conversionPaymentId:
          oneOf:
            - {$ref: '#/components/schemas/PaymentId'}
            - {type: "null"}
          description: Causal confirmed payment, preserved after refunds and cancellation.
        name: {type: [string, "null"]}
        email: {type: [string, "null"]}
        taxId: {type: [string, "null"], description: "CPF/CNPJ."}
        phone:
          type: [string, "null"]
          description: >
            Contact phone (E.164 digits, no leading `+`). Data for reaching, finding or weighing the buyer (dunning, LGPD) — never an identifier: a phone typed into a public checkout proves nothing about who typed it, so nothing resolves an identity from it.

        pspRef: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
    ProductCustomer:
      type: object
      required: [id, customerId, productId, externalId, metadata, creditAlertSent, createdAt]
      description: |
        Product enrollment (product_customers row). The `id` is the enrollment ID
        referenced by subscriptions, invoices, usage, and credit wallets.
      properties:
        id: {type: string, format: uuid, description: "Enrollment ID."}
        customerId: {$ref: '#/components/schemas/CustomerId', description: "Tenant customer ID."}
        productId: {$ref: '#/components/schemas/ProductId'}
        externalId: {type: string}
        name: {type: [string, "null"]}
        email: {type: [string, "null"]}
        taxId: {type: [string, "null"]}
        pspRef: {type: [string, "null"]}
        metadata: {type: object, additionalProperties: true}
        creditAlertSent: {type: boolean}
        createdAt: {type: string, format: date-time}
    PaymentList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Payment"}
        nextCursor:
          type: [string, "null"]
          description: Cursor of the next page; null on a short page.
    CustomerList:
      type: object
      required: [data, summary, nextCursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Customer"}
        summary: {$ref: "#/components/schemas/CustomerSummary"}
        nextCursor:
          type: [string, "null"]
          description: Cursor of the next page; null on a short page.
    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          properties:
            enrollments:
              type: array
              items: {$ref: "#/components/schemas/ProductCustomer"}
    CreateCustomerRequest:
      type: object
      required: [externalId]
      properties:
        externalId: {type: string}
        name: {type: [string, "null"]}
        email: {type: [string, "null"], format: email}
        phone:
          type: [string, "null"]
          description: Optional contact, normalized to E.164 digits by the existing identity rules. Does not identify a person or create a remote payment customer.
        taxId: {type: [string, "null"]}
        country:
          type: [string, "null"]
          description: >
            ISO 3166-1 alpha-2 code (`BR`, `US`), normalized to upper case.

          example: BR
        pspRef: {type: [string, "null"]}
        metadata: {type: object, additionalProperties: true}
    CustomerState:
      type: object
      description: >
        Single-read customer view: the enrollment, every balance it holds, live subscriptions, and current-period usage.

        BREAKING (ADR 0054): `credit` is replaced by `balances`. It reported one hardcoded pool, and there is no default balance any more — a balance belongs to a declared meter, so the response names each one.

      required: [customer, balances, subscriptions, usage, access]
      properties:
        customer: {$ref: "#/components/schemas/ProductCustomer"}
        balances:
          type: array
          description: >
            Every balance the enrollment holds, read the way the consumption gate reads it (the last checkpoint plus the entries after it), with the gate's verdict on each in `allowed`.

          items:
            allOf:
              - $ref: "#/components/schemas/WalletBalance"
              - type: object
                required: [allowed]
                properties:
                  allowed:
                    type: boolean
                    description: >
                      The consumption gate's rule applied to this balance: true when the product version has no floor for it or the balance is above that floor. A customer the gate has just blocked reads false here.

        subscriptions:
          type: array
          items: {$ref: "#/components/schemas/Subscription"}
        usage: {$ref: "#/components/schemas/UsageReport"}
        access:
          type: array
          description: >
            What the customer holds at the store: each product paid for and not fully refunded or charged back (`purchase`), and each subscription still running (`subscription`: active, trialing or past_due). The same list as `access` in `GET /v1/customer-sessions/verify`, for a server that knows the customer id and holds no buyer token.

          items:
            type: object
            required: [productId, name, kind]
            properties:
              productId: {$ref: '#/components/schemas/ProductId'}
              key: {type: string, description: "The manifest key, e.g. ecommerce/ebook"}
              name: {type: string}
              kind: {type: string, enum: [purchase, subscription]}
              subscriptionStatus: {type: string, enum: [active, trialing, past_due]}
              renewsAt: {type: string, format: date-time}
              cancelAtPeriodEnd: {type: boolean}
    Coupon:
      type: object
      description: >
        A merchant discount applied to subscription invoices for a Stripe-style duration. `percentOff` is a decimal string.

      required: [id, code, percentOff, duration, timesRedeemed, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CouponId'}
        code: {type: string}
        percentOff: {type: string}
        duration: {type: string, enum: [once, repeating, forever]}
        durationInCycles: {type: [integer, "null"]}
        maxRedemptions: {type: [integer, "null"]}
        timesRedeemed: {type: integer}
        redeemBy: {type: [string, "null"], format: date-time}
        status: {type: string, enum: [active, archived]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateCouponRequest:
      type: object
      description: >
        Create a coupon. Code matches `^[A-Z0-9_-]{3,32}$`; `percentOff` is a decimal string in (0, 100]. `durationInCycles` is required (>=1) for `repeating` and must be omitted otherwise.

      required: [code, percentOff, duration]
      properties:
        code: {type: string}
        percentOff: {type: string}
        duration: {type: string, enum: [once, repeating, forever]}
        durationInCycles: {type: [integer, "null"]}
        maxRedemptions: {type: [integer, "null"]}
        redeemBy: {type: [string, "null"], format: date-time}
    UsageEvent:
      type: object
      required: [meter]
      properties:
        productId: {$ref: '#/components/schemas/ProductId'}
        customerId: {type: string, description: "The customer's external id."}
        meter: {type: string}
        value: {type: [string, "null"], description: "Decimal string."}
        eventId: {type: string, description: "Client idempotency key."}
        timestamp: {type: [string, "null"], format: date-time}
        metadata: {type: object, additionalProperties: true}
    FacadeUsageEvent:
      type: object
      required: [customerId, meter, eventId]
      oneOf:
        - required: [productId]
        - required: [productKey]
      properties:
        productId: {$ref: '#/components/schemas/ProductId'}
        productKey: {type: string, description: "The product's natural key, the `key` of its CompanyDocument. Use instead of `productId`."}
        customerId: {type: string, description: "The customer's `externalId`, as sent to `customers_create`; not an enrollment id."}
        meter: {type: string}
        value: {type: [string, "null"], description: "Decimal string."}
        eventId: {type: string, description: "Client idempotency key."}
        timestamp: {type: [string, "null"], format: date-time}
        metadata: {type: object, additionalProperties: true}
    IngestResult:
      type: object
      description: Result of an ingestion (single or batch).
      additionalProperties: true
    MeterUsage:
      type: object
      required: [meterId, meter, unit, totalValue, eventCount]
      properties:
        meterId: {type: string, format: uuid}
        meter: {type: string}
        unit: {type: string}
        totalValue: {type: string}
        eventCount: {type: integer}
        totalAmount: {type: [string, "null"]}
        currency: {type: [string, "null"]}
    UsageReport:
      type: object
      description: Per-meter usage totals for a customer over a window.
      required: [customerId, from, to, meters]
      properties:
        customerId: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        meters:
          type: array
          items: {$ref: "#/components/schemas/MeterUsage"}
    Subscription:
      type: object
      required: [id, customerId, productVersionId, status, billingCycle, billingMode, anchor, startedAt]
      properties:
        id: {$ref: '#/components/schemas/SubscriptionId'}
        customerId: {type: string, format: uuid}
        productVersionId: {type: string, format: uuid}
        status:
          type: string
          enum: [trialing, active, past_due, paused, canceled]
        billingCycle: {type: string, enum: [weekly, monthly, annual]}
        collectionMethod: {type: string, enum: [charge_automatically, send_invoice]}
        billingMode: {type: string, enum: [arrears, advance]}
        anchor: {type: string, format: date-time}
        nextBillingDate: {type: [string, "null"], format: date-time}
        startedAt: {type: string, format: date-time}
        canceledAt: {type: [string, "null"], format: date-time}
        cancelReason:
          type: object
          description: Why it was, or will be, canceled. Absent when nobody said.
          required: [code]
          properties:
            code: {type: string}
            note: {type: string}
            source: {type: string, enum: [buyer, merchant]}
        items:
          type: array
          items: {$ref: "#/components/schemas/SubscriptionItem"}
    SubscriptionItem:
      type: object
      required: [id, kind, productVersionId, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [recurring_fee, credit_grant, metered_usage, prepaid_usage]
        timing: {type: [string, "null"], enum: [advance, arrears, null]}
        productVersionId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        canceledAt: {type: [string, "null"], format: date-time}
    SubscriptionPeriod:
      type: object
      required: [id, subscriptionId, periodStart, periodEnd, status]
      properties:
        id: {type: string, format: uuid}
        subscriptionId: {$ref: '#/components/schemas/SubscriptionId'}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        status: {type: string, enum: [open, closed, invoiced]}
        invoiceId: {oneOf: [{$ref: '#/components/schemas/InvoiceId'}, {type: 'null'}]}
    UsageAlert:
      type: object
      required: [id, subscriptionId, active]
      properties:
        id: {type: string, format: uuid}
        subscriptionId: {$ref: '#/components/schemas/SubscriptionId'}
        meterId: {type: [string, "null"], format: uuid}
        thresholdPct: {type: [integer, "null"]}
        thresholdAmount: {type: [string, "null"]}
        active: {type: boolean}
    Invoice:
      type: object
      required: [id, status, currency, subtotal, tax, total, amountDue, createdAt]
      properties:
        id: {$ref: '#/components/schemas/InvoiceId'}
        customerId: {type: [string, "null"], format: uuid, description: "Product enrollment (subscription invoices)."}
        payerId: {oneOf: [{$ref: '#/components/schemas/CustomerId'}, {type: 'null'}], description: "Tenant-level customer (ad-hoc invoices)."}
        subscriptionId: {oneOf: [{$ref: '#/components/schemas/SubscriptionId'}, {type: 'null'}]}
        invoiceNumber: {type: [string, "null"]}
        status:
          type: string
          enum: [draft, pending, open, paid, void, uncollectible]
          description: >-
            `pending` is a checkout's Order before it is paid (ADR 0004): no number yet, nothing owed until the buyer pays, and it becomes `paid` directly when they do or `void` when the checkout expires. Invoice lists omit it unless `status=pending` is asked for.
        currency: {type: string}
        subtotal: {type: string}
        tax: {type: string}
        total: {type: string}
        amountDue: {type: string}
        periodStart: {type: [string, "null"], format: date-time}
        periodEnd: {type: [string, "null"], format: date-time}
        dueDate: {type: [string, "null"], format: date-time}
        finalizedAt: {type: [string, "null"], format: date-time}
        paidAt: {type: [string, "null"], format: date-time}
        successUrl: {type: [string, "null"], description: "Where the hosted checkout returns after payment."}
        cancelUrl: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        lineItems:
          type: array
          items: {$ref: "#/components/schemas/InvoiceLineItem"}
    CreateInvoiceRequest:
      type: object
      required: [payerId]
      properties:
        draft:
          type: boolean
          description: Keep it an editor draft (no number, no event, not sent). `lineItems` is required otherwise.
        payerId: {$ref: '#/components/schemas/CustomerId', description: "Tenant customer (payer) id, from POST /metering/customers."}
        currency: {type: string, description: "ISO 4217; defaults to BRL."}
        dueDate: {type: [string, "null"], format: date-time}
        send: {type: boolean, description: "Emit invoice.sent (email the payer) after finalize."}
        successUrl: {type: [string, "null"], description: "Hosted checkout returns here after payment."}
        cancelUrl: {type: [string, "null"]}
        lineItems:
          type: array
          items:
            type: object
            required: [description, amount]
            properties:
              description: {type: string}
              quantity: {type: string, description: "Defaults to 1."}
              unitPrice: {type: string}
              amount: {type: string, description: "Line total (decimal)."}
    FromUsageRequest:
      type: object
      required: [customerId, from, to]
      properties:
        customerId: {type: string, format: uuid, description: "Enrollment id (product_customers.id) usage is keyed on."}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        send: {type: boolean, description: "Finalize + email the invoice (invoice.sent)."}
    CreateProductInvoiceRequest:
      type: object
      required: [customer]
      properties:
        customer:
          type: object
          required: [externalId]
          properties:
            externalId: {type: string, description: "Stable customer id (e.g. email); enroll is idempotent on it."}
            email: {type: [string, "null"]}
            name: {type: [string, "null"]}
            taxId: {type: [string, "null"]}
        amount: {type: [string, "null"], description: "Override; defaults to the product's published base price."}
        description: {type: [string, "null"], description: "Line description; defaults to the product name."}
        currency: {type: string}
        dueDate: {type: [string, "null"], format: date-time}
        send: {type: boolean}
        successUrl: {type: [string, "null"]}
        cancelUrl: {type: [string, "null"]}
    InvoiceLineItem:
      type: object
      required: [id, type, description, quantity, amount, proration]
      properties:
        id: {type: string, format: uuid}
        type:
          type: string
          enum: [usage, recurring, proration, credit, adjustment, commitment, manual]
        meterId: {type: [string, "null"], format: uuid}
        priceId: {type: [string, "null"], format: uuid}
        description: {type: string}
        quantity: {type: string}
        unitPrice: {type: [string, "null"]}
        amount: {type: string}
        proration: {type: boolean}
    Refund:
      type: object
      required: [id, amount, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/RefundId'}
        amount: {type: string, description: "Decimal string."}
        reason: {type: [string, "null"]}
        reasonCode: {type: [string, "null"]}
        status:
          type: string
          enum: [pending, succeeded, failed, reversed]
          description: >
            A pending row reserves the amount but has no financial effect yet. It stays pending after the provider accepts the refund, until the outcome is confirmed and it becomes succeeded or failed. A succeeded refund can later become reversed.

        providerId:
          type: string
          description: >
            The PSP's own reference for this refund (Stripe's `re_…`). It can be present while an asynchronous refund is still pending.

        createdAt: {type: string, format: date-time}
    DeliverableGrant:
      type: object
      required: [paymentId, token, downloadUrl, createdAt]
      properties:
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        token:
          type: string
          description: >
            The bearer capability inside downloadUrl. Treat it like a password: anyone holding it downloads the paid product with no further proof of purchase.

        downloadUrl:
          type: string
          description: Buyer-facing download link. Answers 410 once revokedAt is set.
        emailSentAt:
          type: [string, "null"]
          format: date-time
          description: When the fulfillment email carrying this link went out.
        revokedAt:
          type: [string, "null"]
          format: date-time
          description: >
            When the download was turned off, set by a full refund or a chargeback on the payment behind it. Non-null means downloadUrl now answers 410 — stop rendering the button. Revoked grants are returned rather than hidden, because a grant that silently vanished would look like fulfillment never ran.

        createdAt: {type: string, format: date-time}
    PublicPaymentStatus:
      type: object
      additionalProperties: false
      required: [id, paymentId, status, provider, method, invoiceStatus, refundedAmount]
      description: >
        Safe public polling projection. It intentionally excludes PSP references, payer identity, decline details and transient browser-action material.

      properties:
        id: {$ref: '#/components/schemas/PaymentId'}
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        status:
          type: string
          enum: [pending, confirmed, failed, refunded, charged_back]
        provider: {type: string, enum: [infi_stripe_uk, pagarme_pix, pagarme_card]}
        method: {type: string, enum: [pix, boleto, card]}
        invoiceStatus: {type: string}
        refundedAmount:
          type: string
          description: Succeeded, non-reversed refund total as a decimal string.
        pixPayload:
          type: string
          description: Persisted copy-paste Pix code, available while this payment is pending.
        pixExpiresAt:
          type: [string, "null"]
          format: date-time
          description: QR presentation deadline; expiry alone does not prove the payment failed.
    PublicPaymentOption:
      description: >
        Methods offered for this purchase and buyer country. BR-to-BR Pix uses the merchant's Pagar.me recipient; eligible UK sales use Stripe Elements. Empty when acceptsPayments is false. Charge creation validates again.

      oneOf:
        - $ref: "#/components/schemas/PublicStripeElementsPaymentOption"
        - $ref: "#/components/schemas/PublicPixPaymentOption"
        - $ref: "#/components/schemas/PublicPagarmeCardPaymentOption"
    PublicPixPaymentOption:
      type: object
      additionalProperties: false
      required: [method, provider, flow]
      description: Brazilian purchase collected directly for the merchant's recipient. Repeating charge creation retrieves the same durable Pix attempt.
      properties:
        method: {type: string, const: pix}
        provider: {type: string, const: pagarme_pix}
        flow: {type: string, const: pix}
    PublicStripeElementsPaymentOption:
      type: object
      additionalProperties: false
      description: >
        A sale of the UK Ltd (ADR 0018, amended 2026-10-16): the buyer pays in Stripe Elements on this page, on a Checkout Session of the UK Ltd's account, so nothing is tokenized for Infi. When offered it is the only option; the charge answers with `checkoutAction` to mount.

      required: [method, provider, flow]
      properties:
        method: {type: string, const: card}
        provider: {type: string, const: infi_stripe_uk}
        flow: {type: string, const: stripe_elements}
    PublicPagarmeCardPaymentOption:
      type: object
      additionalProperties: false
      description: >
        Brazilian domestic card. The browser first prepares the purchase, then tokenizes directly with Core v5 using the public key returned by the prepare response. No public key or payer/provider identity is included in the checkout descriptor.

      required: [method, provider, flow, requiresPayerDetails]
      properties:
        method: {type: string, const: card}
        provider: {type: string, const: pagarme_card}
        flow: {type: string, const: pagarme_core_v5_token}
        requiresPayerDetails: {type: boolean, const: true}
    TaxCategory:
      type: string
      enum: [digital_general, saas, ebook, online_course, live_virtual_training, video_subscription, software_download, digital_images]
    ProductTaxCategory:
      type: object
      additionalProperties: false
      required: [category, taxCode, setAt, categories]
      properties:
        category:
          oneOf:
            - $ref: "#/components/schemas/TaxCategory"
            - type: "null"
        taxCode: {type: [string, "null"], description: The Stripe Tax code the category maps to.}
        setAt: {type: [string, "null"], format: date-time}
        categories:
          type: array
          items: {$ref: "#/components/schemas/TaxCategory"}
    LegalSellerView:
      type: object
      additionalProperties: false
      description: >
        Who sells the Order: the merchant for a direct Brazilian Pix purchase, or the UK Ltd for an eligible merchant-of-record sale. Shown before paying.

      required: [name, country]
      properties:
        name: {type: string, example: Infi UK Ltd}
        country: {type: string, description: ISO 3166-1 alpha-2., example: GB}
    CheckoutTotals:
      type: object
      additionalProperties: false
      description: >
        Totals of a UK Ltd sale. Prices include tax (ADR 0021): `total` is what the buyer pays, before and after payment. `provisional` before payment: Stripe Tax finds the tax inside the price on the hosted page, from the buyer's location, so `tax` is null and `subtotal` equals `total`. `final` once paid: `subtotal` is the sale excluding tax and `tax` the part of the total that was tax.

      required: [currency, subtotal, tax, total, finality]
      properties:
        currency: {type: string}
        subtotal: {type: string, description: "The sale excluding tax once final; the tax-inclusive price while provisional."}
        tax: {type: [string, "null"]}
        total: {type: string}
        finality: {type: string, enum: [provisional, final]}
        buyerCountry: {type: string, description: Purchase country for direct collection or country established by Stripe Tax for final UK totals.}
    Payment:
      type: object
      required: [id, invoiceId, provider, method, amount, currency, status, createdAt, switchable]
      properties:
        id: {$ref: '#/components/schemas/PaymentId'}
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
        provider: {type: string, example: infi_stripe_uk}
        providerId: {type: [string, "null"]}
        method: {type: string, enum: [pix, card]}
        amount: {type: string}
        currency: {type: string}
        status:
          type: string
          enum: [pending, confirmed, failed, refunded, charged_back]
        refundedAmount:
          type: string
          description: >
            Total succeeded, non-reversed refunds so far, as a decimal string; absent when nothing was refunded. Partial refunds leave payment status `confirmed`; only a fully refunded aggregate sets `refunded`. Present on tenant-facing reads only.

        failureCode:
          type: [string, "null"]
          enum: [insufficient_funds, do_not_honor, card_declined, authentication_required, card_expired, card_stolen, card_invalid, mandate_revoked, mandate_refused, brand_changed, provider_error, provider_timeout, superseded, null]
          description: >
            Why a failed charge failed, normalized. Never the provider's own message — that stops at the adapter. `superseded` is not a refusal: the buyer abandoned this charge to pay the same invoice another way. Null on a payment that did not fail, and on one that failed before the reason was recorded. Append-only vocabulary: an unrecognized value must render as a generic failure, never break the client.

        failedAt:
          type: [string, "null"]
          format: date-time
          description: >
            When the charge first moved to `failed`. Distinct from the provider's own event clock, which later events move.

        createdAt: {type: string, format: date-time}
        payer:
          type: ["object", "null"]
          description: >
            Who paid, resolved through the invoice (ad-hoc invoices name a tenant customer directly, subscription invoices name a product enrollment). Present only on the tenant-facing dashboard reads — GET /billing/payments and GET /billing/payments/{paymentID}. Null when the invoice has no resolvable customer.

          properties:
            id: {$ref: '#/components/schemas/CustomerId'}
            name: {type: [string, "null"]}
            email: {type: [string, "null"]}
        invoiceUrl:
          type: string
          description: >
            PSP hosted payment page. Transient — present only on the create-charge response, not on later reads.

        pixPayload:
          type: string
          description: >
            Pix copy-paste (EMV/brcode) string, set for pix charges. Render the QR client-side from this. Persisted, so a refresh/poll re-reads it.

        pixQrImage:
          type: string
          description: >
            Base64 PNG of the pix QR (no data: prefix), returned alongside pixPayload for clients that would rather not render the code themselves.

        pixExpiresAt:
          type: [string, "null"]
          format: date-time
          description: When the pix code expires (pix charges only).
        switchable:
          type: boolean
          description: >
            Whether this charge can still be released so the same invoice can be paid another way (ADR 0026) — true while it is pending, false once it confirmed or failed. Releasing cancels it at the provider where that is supported, and abandons it regardless where it is not. Transient: present on the create-charge response, not on later reads. The hosted checkout keeps the other payment methods clickable while it is true; treat a missing value as false.

        checkoutAction:
          $ref: '#/components/schemas/CheckoutSessionAction'
    CheckoutSessionAction:
      type: object
      required: [kind, paymentId, clientSecret, publishableKey]
      description: >
        How the buyer pays an Order sold by Infi's UK company as merchant of record (ADR 0018, amended 2026-10-16): a Stripe Checkout Session in elements mode, mounted on the Order's own page (also inside the embed). Present only on the create-charge response of such an Order, and on a repeat of it while the session is open (the same session comes back). Load Stripe.js with `publishableKey`, mount Elements on `clientSecret` and confirm with `redirect: "if_required"`: a card, 3DS included, stays on the page. Then read the payment's status back; only the provider's webhook confirms it. A redirect-based method returns to the Order's page; never trust its query string. The client secret is transient: not stored, not on later reads.

      properties:
        kind: {type: string, enum: [stripe_checkout_elements]}
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        clientSecret: {type: string}
        publishableKey: {type: string}
        expiresAt: {type: string, format: date-time}
        mode:
          type: string
          enum: [payment, setup]
          description: >
            `setup` when nothing is charged now and the session only saves the card under `mandate` (a subscription whose first period is free): show no total and a "save card" action. Absent means `payment`.

        mandate:
          $ref: '#/components/schemas/CheckoutMandate'
    WithdrawalWaiver:
      type: object
      required: [version, text]
      description: >
        Present when the charge needs the buyer to waive withdrawal (plan 6f): the page shows `text` beside a box the buyer ticks before paying, and sends `withdrawalWaiver: true`.

      properties:
        version: {type: string, example: wd-v1}
        text: {type: string}
    CheckoutMandate:
      type: object
      required: [version, text]
      description: >
        Present when this payment saves the buyer's card on Infi's UK company's Stripe account for later charges with nobody present (renewals, automatic top-ups, purchases the buyer confirms). Show `text` verbatim next to the pay button: paying under it is the buyer's acceptance, and the payment records `version`. Stripe's own reuse notice is hidden, so this is the only authorization on the page.

      properties:
        version: {type: string}
        text: {type: string}
    PaymentMethodList:
      type: object
      required: [paymentMethods]
      properties:
        paymentMethods:
          type: array
          items: {$ref: "#/components/schemas/PaymentMethod"}
    PaymentMethod:
      type: object
      required: [id, kind, provider, brand, lastFour, expMonth, expYear, status, isDefault, consentAt, lastUsedAt, createdAt]
      description: >
        A credential the payer authorized us to charge again. Display fields only — the provider token, the provider customer reference and the connection are charge material and never appear in an API response.

      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [card, pix_automatico]}
        provider: {type: string, example: stripe}
        brand: {type: [string, "null"], example: visa}
        lastFour: {type: [string, "null"], example: "4242"}
        expMonth: {type: [integer, "null"]}
        expYear: {type: [integer, "null"]}
        status:
          type: string
          enum: [active, requires_action, detached, failed]
          description: >
            Only `active` is charged. `requires_action` is the cue to ask the customer to update their card (expired, re-branded, mandate revoked); while it is set, automatic collection does not run for that payer. Do not collapse this to a boolean.

        isDefault:
          type: boolean
          description: The credential automatic collection charges. At most one per payer.
        consentAt:
          type: string
          format: date-time
          description: >
            When the payer accepted the mandate. Never backfilled or edited — an edited mandate is not evidence in a dispute.

        lastUsedAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
    BillingSettings:
      type: object
      required: [autoChargeEnabled, topupDailyCap, updatedAt, cardAutoChargeAvailable]
      description: The tenant's collection switches.
      properties:
        autoChargeEnabled:
          type: boolean
          description: >
            Whether invoices may be collected from a stored credential with nobody present. Defaults to false, per tenant, deliberately.

        topupDailyCap:
          type: [string, "null"]
          description: Decimal string. Per payer per day, across top-up policies.
        updatedAt: {type: [string, "null"], format: date-time}
        cardAutoChargeAvailable:
          type: boolean
          readOnly: true
          description: >
            Whether a stored card could be charged off-session at all here. No provider does it until Unit 6 (the UK Ltd's off-session charge), so this is false — and autoChargeEnabled would be a switch with nothing to charge.

    PaymentLinkView:
      type: object
      description: Public display payload for a payment link's landing page.
      required: [merchant, product, testMode, paymentOptions, cardEnabled, acceptsPayments]
      properties:
        merchant:
          type: object
          required: [slug, name]
          properties:
            slug: {type: string}
            name: {type: string}
            logoUrl:
              type: string
              format: uri
              description: >
                Absent when the merchant has no logo. Absolute, on this API's host (`/pay/{slug}/logo/{file}`), immutable per upload.

        product:
          $ref: "#/components/schemas/PaymentLinkProduct"
        testMode: {type: boolean}
        paymentOptions:
          type: array
          items: {$ref: "#/components/schemas/PublicPaymentOption"}
        cardEnabled: {type: boolean}
        legalSeller: {$ref: "#/components/schemas/LegalSellerView"}
        totals: {$ref: "#/components/schemas/CheckoutTotals"}
        autoTopupAvailable:
          type: boolean
          description: >
            True when the offer is a credit package (a one-off sale whose product grants credits when paid) and the UK Ltd collects it: the page may offer "automatic top-up", and the charge then takes `autoTopup: true` to save the card under the mandate. Always present.

        withdrawalWaiver: {$ref: "#/components/schemas/WithdrawalWaiver"}
        unavailableReason:
          type: string
          enum: [product_not_available, buyer_country_required, supplier_country_required, supplier_country_conflict, domestic_payments_unavailable, collection_unavailable, country_mismatch, invoice_not_payable, direct_collection_reconciliation_required]
          description: >
            Why this purchase cannot currently accept payment. Missing buyer country allows collecting contact first. Domestic BR card/Pix remains unavailable until Pagar.me dispatch is integrated, without UK fallback. Supplier country can also be missing/conflicting, or the product may still require UK approval (ADR 0026).

        acceptsPayments:
          type: boolean
          description: >
            False when the store cannot receive a payment yet (the UK Ltd has not admitted it): `paymentOptions` is then empty and the checkout says so instead of offering a method. Never omitted.

        successUrl:
          type: [string, "null"]
          description: Where the merchant sends the payer after paying, if set on the link.
        cancelUrl:
          type: [string, "null"]
          description: Where "back to the merchant" goes, if set on the link.
        remember: {$ref: "#/components/schemas/CheckoutRememberOffer"}
        mandate: {$ref: "#/components/schemas/CheckoutMandateOffer"}
        appearance: {$ref: "#/components/schemas/Appearance"}
    IncludedUnit:
      type: object
      description: Public included quantity from the same published product version as the link price. No balance or grant action is implied.
      required: [unit, quantity, on]
      properties:
        unit: {type: string, description: Public display name of the granted unit.}
        quantity: {type: string, description: Included quantity as an exact decimal string.}
        on: {type: string, enum: [payment, cycle], description: Existing grant trigger. Cycle grants can precede payment of a renewal.}
    PaymentLinkProduct:
      type: object
      required: [name, type, pricingModel, currency]
      properties:
        name: {type: string}
        description:
          type: string
          description: Current public product description, rendered as plain text.
        billingCycle:
          type: string
          enum: [weekly, monthly, annual]
          description: Billing cycle of the same resolved version as price. Absent for a one-time offer.
        type: {type: string, enum: [agent, item]}
        pricingModel:
          type: string
          enum: [subscription, one_time, usage, prepaid]
        price:
          type: string
          description: >
            Version base price as a decimal string. Absent when the version carries none (pure usage pricing).

        currency: {type: string, example: BRL}
        includedUnits:
          type: array
          items: {$ref: "#/components/schemas/IncludedUnit"}
        media:
          type: array
          items: {$ref: "#/components/schemas/ProductMedia"}
        faq:
          type: array
          items: {$ref: "#/components/schemas/ProductFAQ"}
        purchaseButtonText: {type: string}
        guaranteeDays: {type: integer}
    CheckoutRememberOffer:
      type: object
      description: >
        The "lembrar de mim" wording, rendered by the server so the version a buyer accepts names words they actually read.

      required: [version, text]
      properties:
        version: {type: string, description: "Echo it as `rememberTextVersion` on the charge."}
        text: {type: string}
    CheckoutMandateOffer:
      type: object
      description: The "save my card" authorization wording.
      required: [version, text]
      properties:
        version: {type: string, description: "Echo it as `consentTextVersion` on the charge."}
        text: {type: string}
    CheckoutMerchant:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
        logoUrl:
          type: string
          format: uri
          description: Absent when the merchant has no logo. Absolute, immutable per upload.
    LinkCheckoutSession:
      type: object
      description: Response to creating/reusing a link checkout session (step 1).
      required: [sessionId, product, status, expiresAt, testMode, paymentOptions, cardEnabled, acceptsPayments]
      properties:
        buyerCountry:
          type: string
          description: The stored country; a resumed materialized purchase preserves its original value.
        sessionId: {type: string, format: uuid}
        product:
          $ref: "#/components/schemas/PaymentLinkProduct"
        status: {type: string, enum: [open, processing, completed, expired]}
        expiresAt: {type: string, format: date-time}
        testMode: {type: boolean}
        paymentOptions:
          type: array
          items: {$ref: "#/components/schemas/PublicPaymentOption"}
        cardEnabled: {type: boolean}
        legalSeller: {$ref: "#/components/schemas/LegalSellerView"}
        totals: {$ref: "#/components/schemas/CheckoutTotals"}
        autoTopupAvailable:
          type: boolean
          description: >
            True when the offer is a credit package (a one-off sale whose product grants credits when paid) and the UK Ltd collects it: the page may offer "automatic top-up", and the charge then takes `autoTopup: true` to save the card under the mandate. Always present.

        withdrawalWaiver: {$ref: "#/components/schemas/WithdrawalWaiver"}
        unavailableReason:
          type: string
          enum: [product_not_available, buyer_country_required, supplier_country_required, supplier_country_conflict, domestic_payments_unavailable, collection_unavailable, country_mismatch, invoice_not_payable, direct_collection_reconciliation_required]
          description: >
            Why this purchase cannot currently accept payment. Missing buyer country allows collecting contact first. Domestic BR card/Pix remains unavailable until Pagar.me dispatch is integrated, without UK fallback. Supplier country can also be missing/conflicting, or the product may still require UK approval (ADR 0026).

        acceptsPayments:
          type: boolean
          description: >
            False when the store cannot receive a payment yet (the UK Ltd has not admitted it): `paymentOptions` is then empty and the checkout says so instead of offering a method. Never omitted.

    LinkCheckoutSessionState:
      type: object
      description: >
        Session read shape — also the `checkout_session.*` webhook payload, which is why it differs from LinkCheckoutSession (`id`, not `sessionId`).

      required: [id, status, email, expiresAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [open, processing, completed, expired]}
        email: {type: string, format: email}
        name: {type: string}
        expiresAt: {type: string, format: date-time}
        invoiceId:
          $ref: '#/components/schemas/InvoiceId'
          description: Set once the charge step has materialized the invoice.
        paymentId:
          $ref: '#/components/schemas/PaymentId'
          description: Set once a charge has been created.
    LinkCheckoutSessionCoupon:
      type: object
      description: >
        What a coupon does to a payment-link purchase, computed server-side. The browser renders these figures; it must not derive a total of its own, because the invoice is priced by the backend at materialization.

      required: [code, subtotal, discount, total, currency]
      properties:
        code:
          type: string
          description: The code as stored — upper-cased and trimmed.
          example: "PROMO10"
        subtotal: {type: string, example: "100.00"}
        discount: {type: string, example: "10.00"}
        total:
          type: string
          description: What the buyer will be charged.
          example: "90.00"
        currency: {type: string, example: "BRL"}
    InvoiceChargeRequest:
      description: >
        `CheckoutChargeRequest` on an invoice's own payment page, plus the payer's CPF/CNPJ and phone repairs. Values are stored on the payer only when absent and never replace a different value already on file.

      allOf:
        - $ref: "#/components/schemas/CheckoutChargeRequest"
        - type: object
          properties:
            quoteId: {type: string, format: uuid}
            revision: {type: integer, format: int64, minimum: 1}
            consentDigest:
              type: string
              description: Required with quoteId and revision for a fresh invoice purchase. Existing financial identities use their original retry protocol.
            taxId:
              type: string
              description: CPF (11 digits) or CNPJ (14), punctuation allowed.
            phone:
              type: string
              description: Required for direct Pix. Brazilian 10/11-digit national or 55-prefixed number; punctuation allowed.
    InvoiceBrazilCardPrepareRequest:
      type: object
      additionalProperties: false
      required: [quoteId, revision, consentDigest]
      properties:
        renewalConsent: {$ref: "#/components/schemas/BrazilCardRenewalConsent"}
        quoteId: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        consentDigest: {type: string, minLength: 1}
        taxId:
          type: string
          description: Optional CPF/CNPJ supplied through the invoice purchase owner before preparation.
        phone:
          type: string
          description: Required before Pagar.me card preparation. Brazilian 10/11-digit national or 55-prefixed number; punctuation allowed.
    SessionBrazilCardPrepareRequest:
      type: object
      additionalProperties: false
      properties:
        renewalConsent: {$ref: "#/components/schemas/BrazilCardRenewalConsent"}
        remember: {type: boolean}
        rememberTextVersion: {type: string}
    CheckoutBrazilCardSubmitRequest:
      type: object
      additionalProperties: false
      required: [preparation, token, billingAddress]
      properties:
        preparation:
          type: string
          description: Opaque short-lived preparation capability; never a card token.
        token:
          type: string
          description: Transient one-use Core v5 token. Never stored or included in telemetry.
        billingAddress: {$ref: '#/components/schemas/BrazilCardBillingAddress'}
    CheckoutBrazilCardStatusRequest:
      type: object
      additionalProperties: false
      required: [preparation]
      properties:
        preparation:
          type: string
          description: Opaque capability sent in a POST body for token-free readback.
    CheckoutBrazilCardPreparation:
      type: object
      additionalProperties: false
      required: [preparation, publicKey, expiresAt]
      properties:
        renewalOffer: {$ref: "#/components/schemas/BrazilCardRenewalOffer"}
        preparation: {type: string, description: Opaque short-lived signed capability.}
        publicKey: {type: string, description: Public Core v5 tokenization key; returned only after preparation succeeds.}
        expiresAt: {type: string, format: date-time}
    BrazilCardRenewalConsent:
      type: object
      additionalProperties: false
      required: [textVersion]
      properties:
        textVersion: {type: string, minLength: 1}
    BrazilCardRenewalOffer:
      type: object
      additionalProperties: false
      required: [textVersion, text, amountMinor, currency, cadence]
      properties:
        textVersion: {type: string}
        text: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        cadence: {type: string}
    CheckoutBrazilCardStatus:
      oneOf:
        - $ref: '#/components/schemas/CheckoutBrazilCardWaiting'
        - $ref: '#/components/schemas/CheckoutBrazilCardExpired'
        - $ref: '#/components/schemas/CheckoutBrazilCardAttempt'
      discriminator:
        propertyName: kind
        mapping:
          waiting: '#/components/schemas/CheckoutBrazilCardWaiting'
          expired: '#/components/schemas/CheckoutBrazilCardExpired'
          attempt: '#/components/schemas/CheckoutBrazilCardAttempt'
    CheckoutBrazilCardWaiting:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, const: waiting}
    CheckoutBrazilCardExpired:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, const: expired}
    CheckoutBrazilCardAttempt:
      type: object
      additionalProperties: false
      required: [kind, payment]
      properties:
        kind: {type: string, const: attempt}
        payment: {$ref: '#/components/schemas/Payment'}
    BrazilCardBillingAddress:
      type: object
      additionalProperties: false
      required: [line1, zipCode, city, state, country]
      properties:
        line1: {type: string, minLength: 1}
        line2: {type: string}
        zipCode: {type: string, minLength: 1}
        city: {type: string, minLength: 1}
        state: {type: string, minLength: 1}
        country: {type: string, minLength: 1}
    CheckoutChargeRequest:
      type: object
      required: [method]
      description: >
        `method` is validated server-side and answers **422** (not 400) when missing, outside the enum, or not offered in the checkout's `paymentOptions`. The current UK integration offers only `card`. A request for `pix` is refused rather than converted to card, before creating an Order, updating payer tax ID, or preparing a payment.

      properties:
        method: {type: string, enum: [pix, card]}
        remember:
          type: boolean
          description: >
            Payer ticked "lembrar de mim": asks Infi to remember them as a person across stores. Never an authorization to charge a card. Send it only when ticked.

        rememberTextVersion:
          type: string
          description: >
            The wording the payer saw — echo `remember.version` from the checkout read. What the server records as the version accepted.

        surface:
          type: string
          enum: [embed]
          description: >
            `embed` when the page paying is inside a merchant's iframe. On a UK Ltd sale it makes a redirect-based method return to the embed's own Order page (`/pay` refuses to be framed). Omit on `/pay`. Infi builds the return URL; the browser never supplies one.

        autoTopup:
          type: boolean
          description: >
            The buyer of a credit package ticked "automatic top-up" (offered when `autoTopupAvailable`): the card is saved on the UK account under the mandate the charge returns, and the merchant's policy can then buy the package again with nobody present. Send it only when ticked; ignored on an offer that is not a credit package.

        withdrawalWaiver:
          type: boolean
          description: >
            The buyer ticked the page's `withdrawalWaiver`: they ask for the digital content at once and acknowledge that it ends the statutory right of withdrawal (plan 6f). Required on every UK sale but the payment of a renewal: without it the charge answers 422 `withdrawal_waiver_required` before anything is frozen or sent to Stripe. The Order records the version, the words and the IP, and the receipt e-mail repeats them.

    MorApplicationInput:
      type: object
      required: [legalName, country, taxId, productCategories]
      properties:
        legalName: {type: string, maxLength: 200}
        country: {type: string, description: ISO 3166-1 alpha-2, pattern: "^[A-Za-z]{2}$"}
        taxId: {type: string, maxLength: 64}
        productCategories:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, maxLength: 64}
    MorSeller:
      type: object
      required: [name, country]
      properties:
        name: {type: string}
        country: {type: string}
    MorAgreement:
      type: object
      required: [id, version, marginPercent, marginFixed, termsDigest, termsText]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        marginPercent:
          type: [string, "null"]
          description: Infi's margin as a percentage of the total charged, tax included (ADR 0022), a decimal string. Null until decided.
        marginFixed:
          type: object
          description: >
            The fixed part of the margin, charged once per paid Order, keyed by ISO 4217 currency, as a decimal string (e.g. `{"USD": "0.50"}`). A currency missing here has no fixed amount decided.

          additionalProperties: {type: string}
        termsDigest: {type: string}
        termsText:
          type: [string, "null"]
          description: >
            The terms the digest identifies (Markdown), when the repository holds that text (2026-10-17: the rolling reserve of ADR 0027 and the dispute fee at cost of ADR 0020). Null for a revision whose text is not held.

    MorAdmission:
      type: object
      required: [status, application, agreementRevisionId, agreementAcceptedAt, submittedAt, decidedAt, decisionReason]
      properties:
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        application:
          oneOf:
            - $ref: "#/components/schemas/MorApplicationInput"
            - type: "null"
        agreementRevisionId: {type: [string, "null"], format: uuid}
        agreementAcceptedAt: {type: [string, "null"], format: date-time}
        submittedAt: {type: [string, "null"], format: date-time}
        decidedAt: {type: [string, "null"], format: date-time}
        decisionReason: {type: [string, "null"]}
    ReceivingBalanceSummary:
      type: object
      required: [balances, asOf]
      properties:
        asOf: {type: string, format: date-time}
        balances:
          type: array
          items: {$ref: "#/components/schemas/ReceivingCurrencyBalance"}
    ReceivingCurrencyBalance:
      type: object
      required: [currency, available, pending, review, held, processing, paid, reserve, receivable]
      properties:
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        available: {type: string, description: "BR withdrawable balance; UK approved payout intent net of offsets."}
        pending: {type: string, description: "BR waiting funds; UK unassigned accrued entitlement awaiting release or cycle."}
        review: {type: string, nullable: true}
        held: {type: string}
        processing: {type: string, nullable: true, description: "Includes provider_unknown; not proof of bank receipt."}
        paid: {type: string, description: "Transferred by BR provider; UK lifetime sent beneficiary amount in its actual currency."}
        reserve: {type: string, nullable: true}
        receivable: {type: string, description: "Positive debt, negative credit. Kept separate from a future cash forecast."}
    AccountPayoutsView:
      type: object
      required: [identityCheck, beneficiary, brlTerms, payouts, receivables]
      properties:
        identityCheck: {type: string, nullable: true, enum: [open, approved, rejected]}
        beneficiary:
          type: object
          nullable: true
          required: [currency, accountMask, holderName]
          properties:
            currency: {type: string, example: BRL}
            accountMask: {type: string, example: "…3000"}
            holderName: {type: string}
        brlTerms:
          type: object
          required: [text, version, accepted, acceptedAt]
          properties:
            text: {type: string}
            version: {type: string}
            accepted: {type: boolean}
            acceptedAt: {type: string, format: date-time, nullable: true}
        payouts:
          type: array
          items: {$ref: "#/components/schemas/AccountPayout"}
        receivables: {$ref: "#/components/schemas/AccountReceivables"}
        reserves: {$ref: "#/components/schemas/AccountReserves"}
    PlatformRisk:
      type: object
      required: [windowDays, sales, disputes, rate, threshold, alert]
      properties:
        windowDays: {type: integer, example: 30}
        sales: {type: integer}
        disputes: {type: integer}
        rate: {type: number, example: 0.0123}
        threshold: {type: number, example: 0.0065}
        alert: {type: boolean}
    CreatorHealthList:
      type: object
      required: [platform, items]
      properties:
        platform: {$ref: "#/components/schemas/PlatformRisk"}
        items:
          type: array
          items: {$ref: "#/components/schemas/CreatorHealthSummary"}
    CreatorHealthSummary:
      type: object
      required: [tenantId, name, slug, score, metrics, debt, reserve, heldPayouts]
      properties:
        tenantId: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        score:
          type: object
          required: [level, tier, reasons, override]
          properties:
            level: {type: string, enum: [green, yellow, red]}
            tier: {type: string, enum: [new, green, yellow, red]}
            reasons:
              type: array
              description: Every rule that fired, with the value and the threshold it crossed.
              items:
                type: object
                required: [code, level, value, threshold]
                properties:
                  code: {type: string, example: dispute_rate}
                  level: {type: string, enum: [yellow, red]}
                  value: {type: number}
                  threshold: {type: number}
            override:
              type: object
              nullable: true
              required: [tier, reason, by, at]
              properties:
                tier: {type: string, enum: [new, green, yellow, red]}
                reason: {type: string}
                by: {type: string, format: uuid}
                at: {type: string, format: date-time}
        metrics:
          type: object
          required: [windowDays, sales, volume, refunds, disputes, disputesWon, disputesLost, fraudWarnings, disputeRate, refundRate, winRate, firstSaleAt]
          properties:
            windowDays: {type: integer, example: 90}
            sales: {type: integer}
            volume:
              type: array
              items:
                type: object
                required: [currency, sales, amount]
                properties:
                  currency: {type: string}
                  sales: {type: integer}
                  amount: {type: string}
            refunds: {type: integer}
            disputes: {type: integer}
            disputesWon: {type: integer}
            disputesLost: {type: integer}
            fraudWarnings: {type: integer}
            disputeRate: {type: number}
            refundRate: {type: number}
            winRate: {type: number, nullable: true, description: "Won over decided disputes, null with none decided."}
            firstSaleAt: {type: string, format: date-time, nullable: true}
        debt:
          type: array
          description: What the creator owes the UK Ltd per currency; negative when the UK Ltd owes it.
          items:
            type: object
            required: [currency, amount]
            properties:
              currency: {type: string}
              amount: {type: string}
        reserve:
          type: array
          items:
            type: object
            required: [currency, held]
            properties:
              currency: {type: string}
              held: {type: string}
        heldPayouts: {type: integer}
    CreatorHealthDetail:
      allOf:
        - $ref: "#/components/schemas/CreatorHealthSummary"
        - type: object
          required: [ageDays, admission, identityCheck, reserveReleases, heldPayoutRows, pendingProducts]
          properties:
            ageDays: {type: integer}
            admission: {type: string, nullable: true}
            identityCheck: {type: string, nullable: true}
            reserveReleases:
              type: array
              items:
                type: object
                required: [currency, amount, releaseOn]
                properties:
                  currency: {type: string}
                  amount: {type: string}
                  releaseOn: {type: string, format: date-time}
            heldPayoutRows:
              type: array
              items:
                type: object
                required: [payoutId, cycle, currency, amount, holdReason, createdAt]
                properties:
                  payoutId: {type: string, format: uuid}
                  cycle: {type: string}
                  currency: {type: string}
                  amount: {type: string}
                  holdReason: {type: string, example: creator_red}
                  createdAt: {type: string, format: date-time}
            pendingProducts:
              type: array
              items:
                type: object
                required: [productId, name]
                properties:
                  productId: {type: string, format: uuid}
                  name: {type: string}
    AccountReserves:
      type: object
      description: >-
        What the UK Ltd holds back of the Account's payouts under its reserve tier (ADR 0027). It is still the Account's money, not a fee: it is released in the first cycle after its day, or a debt takes it first.
      required: [balances, releases]
      properties:
        balances:
          type: array
          description: Held per currency; only currencies with something held.
          items:
            type: object
            required: [currency, held]
            properties:
              currency: {type: string, example: EUR}
              held: {type: string, example: "3.89"}
        releases:
          type: array
          description: What is released on each day, per currency, oldest first.
          items:
            type: object
            required: [currency, amount, releaseOn]
            properties:
              currency: {type: string, example: EUR}
              amount: {type: string, example: "3.89"}
              releaseOn: {type: string, format: date-time}
    AccountReceivables:
      type: object
      description: What the Account owes the UK Ltd and how payouts took it back.
      required: [balances, items]
      properties:
        balances:
          type: array
          description: Open debt per currency; only currencies with a balance.
          items:
            type: object
            required: [currency, open]
            properties:
              currency: {type: string, example: EUR}
              open: {type: string, example: "39.88"}
        items:
          type: array
          items: {$ref: "#/components/schemas/AccountReceivable"}
    AccountReceivable:
      type: object
      required: [id, currency, source, amount, open, createdAt, offsets]
      properties:
        id: {type: string, format: uuid}
        currency: {type: string}
        source:
          type: string
          description: >-
            What made the debt: refund_reversal (a refund of a sale already paid out), refund_fee (Stripe's fee on a refund, ADR 0023), payout_excess (a refund that landed while the payout was in flight), payout_returned (a returned payout giving that back), dispute, dispute_fee, dispute_won, dispute_processor_fee (Stripe's fee on a disputed share, ADR 0020) and dispute_processor_fee_won (its return when the dispute is won), reserve_applied (a held reserve a debt took first, ADR 0027) and reserve_released (a reserve whose day came, a credit the cycle pays).
          enum: [refund_reversal, refund_fee, payout_excess, payout_returned, dispute, dispute_fee, dispute_won, dispute_processor_fee, dispute_processor_fee_won, reserve_applied, reserve_released]
        amount: {type: string, example: "38.93", description: Signed; a negative row lowers the debt.}
        open: {type: string, example: "0.00"}
        createdAt: {type: string, format: date-time}
        offsets:
          type: array
          items:
            type: object
            required: [payoutId, cycle, amount, state, at, payoutCurrency, convertedAmount, rate]
            properties:
              payoutId: {type: string, format: uuid}
              cycle: {type: string, example: "2026-11-15"}
              amount: {type: string, description: What the payout took of the debt, in the debt's currency.: null}
              state:
                type: string
                enum: [reserved, settled, released]
                description: reserved while the payout waits, settled once paid, released when it ended without paying.
              at: {type: string, format: date-time}
              payoutCurrency:
                type: string
                nullable: true
                description: Set when the debt was in another currency than the payout (ADR 0023, amended 2026-10-16).
              convertedAmount:
                type: string
                nullable: true
                description: What the debt paid of the payout, in payoutCurrency, at Wise's mid-market rate with no spread.
              rate: {type: string, nullable: true, description: The rate used, payoutCurrency per unit of the debt's currency.: null}
    AccountPayout:
      type: object
      required: [id, cycle, status, holdReason, owedCurrency, owed, offset, transfer, paidCurrency, paid, fxRate, fee, createdAt, updatedAt, sentAt]
      properties:
        id: {type: string, format: uuid}
        cycle: {type: string, example: "2026-11-01"}
        status:
          type: string
          description: offset means the Account's debt paid the whole cycle and nothing was sent.
          enum: [held, pending_approval, approved, created, funded, sent, returned, cancelled, provider_unknown, refused, rejected, offset]
        holdReason: {type: string, nullable: true}
        owedCurrency: {type: string}
        owed: {type: string, example: "77.86"}
        offset: {type: string, example: "39.88", description: The part of owed the Account's debt paid.}
        transfer: {type: string, example: "37.98", description: "owed − offset: what goes through Wise, before any conversion."}
        paidCurrency: {type: string, nullable: true}
        paid: {type: string, nullable: true, example: "196.15"}
        fxRate: {type: string, nullable: true, example: "5.08937"}
        fee: {type: string, nullable: true, example: "1.98"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time, nullable: true}
    MorAdmissionView:
      type: object
      required: [seller, agreement, admission, policy, eligibility]
      properties:
        seller:
          oneOf:
            - $ref: "#/components/schemas/MorSeller"
            - type: "null"
        agreement:
          oneOf:
            - $ref: "#/components/schemas/MorAgreement"
            - type: "null"
        admission: {$ref: "#/components/schemas/MorAdmission"}
        policy: {$ref: "#/components/schemas/MorPolicy"}
        eligibility: {$ref: "#/components/schemas/MorEligibility"}
    MorPolicy:
      type: object
      description: The product policy in force (ADR 0026) and the version this Account accepted.
      required: [version, text, acceptedVersion, acceptedAt]
      properties:
        version: {type: string, example: "2026-10-17"}
        text: {type: string, description: The policy, in Markdown.: null}
        acceptedVersion: {type: [string, "null"]}
        acceptedAt: {type: [string, "null"], format: date-time}
    MorEligibilityAnswers:
      type: object
      required: [sells, country, entityType, currency]
      additionalProperties: false
      properties:
        sells:
          type: string
          enum: [digital_downloads, software_saas, ai_agents, courses_training, memberships_community, productized_services, physical_goods, regulated_services, adult, gambling, crypto_investments, money_gift_cards, resale_without_rights]
        country: {type: string, description: ISO 3166-1 alpha-2.}
        entityType: {type: string, enum: [individual, company]}
        currency: {type: string, description: ISO 4217.}
    MorEligibilityIssue:
      type: object
      required: [field, code, blocking]
      properties:
        field: {type: string}
        code:
          type: string
          description: "`prohibited_<kind>`, `sanctioned_country` or `currency_not_offered`."
        blocking: {type: boolean}
    MorEligibility:
      type: object
      required: [answers, issues, eligible, sellsOptions]
      properties:
        answers:
          oneOf:
            - $ref: "#/components/schemas/MorEligibilityAnswers"
            - type: "null"
        issues:
          type: array
          items: {$ref: "#/components/schemas/MorEligibilityIssue"}
        eligible: {type: boolean, description: Answered and nothing blocks.}
        sellsOptions:
          type: array
          items: {type: string}
          description: The kinds the question offers, allowed ones first.
    ProductReviewStatus:
      type: string
      enum: [pending_review, approved, rejected, changes_requested]
    ProductReviewStandings:
      type: object
      required: [required, products]
      properties:
        required: {type: boolean}
        products:
          type: array
          items:
            type: object
            required: [productId, name, status, sells, underTrust, reason, decidedAt]
            properties:
              productId: {type: string}
              name: {type: string}
              status: {$ref: "#/components/schemas/ProductReviewStatus"}
              sells: {type: boolean}
              underTrust: {type: boolean}
              reason: {type: [string, "null"]}
              decidedAt: {type: [string, "null"], format: date-time}
    ProductReviewQueue:
      type: object
      required: [required, trustAfter, items]
      properties:
        required: {type: boolean}
        trustAfter: {type: integer, description: "PULSE_PRODUCT_REVIEW_TRUST_AFTER; 0 is off."}
        items:
          type: array
          items: {$ref: "#/components/schemas/ProductReviewQueueItem"}
    ProductReviewQueueItem:
      type: object
      required: [tenantId, tenantName, tenantSlug, admissionStatus, productId, name, description, category, digest, price, currency, pageUrl, underTrust, previous, history, updatedAt]
      properties:
        tenantId: {type: string, format: uuid}
        tenantName: {type: string}
        tenantSlug: {type: string}
        admissionStatus: {type: string}
        productId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        category: {type: string, description: Tax category in force; empty when none was set.}
        digest: {type: string}
        price: {type: [string, "null"]}
        currency: {type: string}
        pageUrl: {type: string}
        underTrust: {type: boolean}
        previous:
          oneOf:
            - type: object
              required: [decision, reason, name, description, category, at]
              properties:
                decision: {type: string, enum: [approved, rejected, changes_requested]}
                reason: {type: [string, "null"]}
                name: {type: string}
                description: {type: string}
                category: {type: string}
                at: {type: string, format: date-time}
            - type: "null"
        history:
          type: object
          required: [sales, refunds, disputes, approvedProducts, rejections]
          properties:
            sales: {type: integer}
            refunds: {type: integer}
            disputes: {type: integer}
            approvedProducts: {type: integer}
            rejections: {type: integer}
        updatedAt: {type: string, format: date-time}
    ProductReviewDecisionInput:
      type: object
      required: [decision, digest]
      properties:
        decision: {type: string, enum: [approved, rejected, changes_requested]}
        reason: {type: string}
        digest: {type: string}
    ProductReviewDecision:
      type: object
      required: [productId, decision, reason, decidedBy, at]
      properties:
        productId: {type: string, format: uuid}
        decision: {type: string, enum: [approved, rejected, changes_requested]}
        reason: {type: [string, "null"]}
        decidedBy: {type: string}
        at: {type: string, format: date-time}
    MorDecisionInput:
      type: object
      properties:
        reason: {type: string, description: Required to reject; optional note on approve.}
    MorDecision:
      type: object
      required: [tenantId, status, decisionReason]
      properties:
        tenantId: {type: string, format: uuid}
        status: {type: string, enum: [approved, rejected]}
        decisionReason: {type: [string, "null"]}
    AccountClosure:
      type: object
      required: [state, reopenable]
      properties:
        state: {type: string, enum: [active, closing, closed]}
        requestedAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time}
        reasonCode: {type: string}
        reason: {type: string}
        reopenable: {type: boolean, description: True on sandbox, where a closed account can be reopened here.: null}
    Tenant:
      type: object
      required: [id, slug, name, status, termsUrl, supportEmail, logoUrl, appearance, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/AccountId'}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, suspended, closed]}
        termsUrl:
          type: [string, "null"]
          format: uri
          description: >
            The merchant's terms of use, quoted in the payment mandate a payer accepts before being charged off-session. null when unset.

          example: https://acme.ai/termos
        supportEmail:
          type: [string, "null"]
          format: email
          description: >
            The merchant's contact address: Reply-To on payer-facing email and where Infi sends the merchant's own account notices. null when unset, in which case the owner's login email is used instead.

          example: contato@acme.ai
        logoUrl:
          type: [string, "null"]
          format: uri
          description: >
            The merchant logo the hosted checkout and the embed render next to the merchant name. Absolute, served by `GET /pay/{slug}/logo/{file}`, and immutable per upload (a new upload is a new URL). null when unset; the checkout then shows the merchant's initials.

        appearance: {$ref: "#/components/schemas/BusinessAppearance"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PresignTenantLogoRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          description: >
            SVG is refused on purpose: it is a document that runs script when served inline, and the logo route serves inline.

        sizeBytes:
          type: integer
          format: int64
          maximum: 1048576
          description: Exact size of the file; signed into the upload URL. At most 1 MiB.
    PresignTenantLogoResponse:
      type: object
      required: [uploadUrl, objectKey, expiresAt]
      properties:
        uploadUrl:
          type: string
          description: PUT the file here with the same Content-Type, no auth headers.
        objectKey:
          type: string
          description: Echo it back as `logoObjectKey` on `PATCH /account/tenant` once the PUT succeeds.
        expiresAt: {type: string, format: date-time}
    ApiKey:
      type: object
      required: [id, prefix, kind, lastFour, tier, scopes, createdAt]
      properties:
        id: {type: string, format: uuid}
        prefix: {type: string, example: sk_live}
        kind: {type: string, enum: [secret, publishable], default: secret}
        name: {type: string, description: "Label of a CLI project key (create-infi-app · loja · mac); absent for keys made in the dashboard."}
        lastFour: {type: string}
        tier: {type: string, enum: [free, pro, enterprise]}
        scopes:
          type: array
          items: {type: string}
        revokedAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
        # Full raw key, present only for publishable keys (public by design —
        # the dashboard can always display them). Secret keys are hash-only.
        value: {type: string}
    ApiKeyDetail:
      type: object
      required: [apiKey, usage]
      properties:
        apiKey: {$ref: "#/components/schemas/ApiKey"}
        usage: {$ref: "#/components/schemas/ApiKeyUsage"}
    ApiKeyUsage:
      type: object
      description: >
        Exact aggregates over retained captured observations in [from, to). Request count includes all HTTP statuses; errors are status >= 400. Error rate is errorCount/requestCount between 0 and 1, or zero when empty. Average is the arithmetic mean and p95 uses continuous percentile interpolation. Empty latency aggregates are zero. Last use is the latest retained captured request before to, including refusals, and may precede the selected window. It is null when no retained observation exists, not proof the key was never used. Capture can lose observations under overload; these are not billing-grade totals.

      required: [window, from, to, lastUsedAt, requestCount, errorCount, errorRate, averageLatencyMs, p95LatencyMs]
      properties:
        window: {type: string, enum: [24h, 7d]}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        lastUsedAt: {type: [string, "null"], format: date-time}
        requestCount: {type: integer, format: int64, minimum: 0}
        errorCount: {type: integer, format: int64, minimum: 0}
        errorRate: {type: number, format: double, minimum: 0, maximum: 1}
        averageLatencyMs: {type: number, format: double, minimum: 0}
        p95LatencyMs: {type: number, format: double, minimum: 0}
    ApiKeyRequest:
      type: object
      required: [id, occurredAt, requestId, method, route, status, durationMs]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        requestId: {type: string}
        method: {type: string}
        route: {type: string, description: Normalized route template without parameter values or query strings.}
        status: {type: integer, minimum: 100, maximum: 599}
        durationMs: {type: number, format: double, minimum: 0}
        errorCode: {type: string}
    ApiKeyAuditEvent:
      type: object
      required: [id, occurredAt, actorType, actorId, action, targetType, targetId]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        actorType: {type: string}
        actorId: {type: [string, "null"]}
        action: {type: string}
        targetType: {type: [string, "null"]}
        targetId: {type: [string, "null"]}
        fromState:
          type: string
          description: Absent with current audit producers, which do not persist the previous state.
        toState:
          type: string
          description: Recognized persisted state or configuration status. It does not imply financial confirmation.
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            secret:
              type: string
              description: The raw secret, returned only once at creation.
    CLITokenResponse:
      type: object
      required: [email, tenant, apiKey]
      properties:
        email: {type: string, format: email}
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id: {$ref: '#/components/schemas/AccountId'}
            slug: {type: string}
            name: {type: string}
        apiKey:
          description: >
            The welcome key, minted only on the sandbox deployment (an sk_test_ key). Absent on live: a live account starts unactivated and gets no credentials until Go Live — see ADR 0057.

          allOf:
            - $ref: "#/components/schemas/CreatedApiKey"
            - type: object
              properties:
                secret: {type: string, description: Only when the key was minted by this call.}
                name: {type: string}
                reused: {type: boolean, description: The project already held this key; no secret is returned.}
    SessionBootstrapRequest:
      type: object
      required: [accountName]
      properties:
        accountName:
          type: string
          description: Display name for the new tenant
        slug:
          type: string
          description: URL-safe tenant slug; derived from accountName when omitted
        signupSource:
          type: string
          description: Partner or channel attribution (e.g. lovable, cli, web)
        acceptedTermsVersion:
          type: string
          description: >
            The Infi Terms version the operator accepted. Required on live for the first login and must equal `termsVersion` from `POST /auth/session/sync`; sending it is the acceptance. Ignored on sandbox and for a subject already attached.

    SessionBootstrapResponse:
      type: object
      required: [email, tenant, user]
      properties:
        email: {type: string, format: email}
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id: {$ref: '#/components/schemas/AccountId'}
            slug: {type: string}
            name: {type: string}
        user:
          type: object
          required: [id, tenantId, email, role]
          properties:
            id: {type: string, format: uuid}
            tenantId: {$ref: '#/components/schemas/AccountId'}
            email: {type: string, format: email}
            role: {type: string}
    SessionSyncResponse:
      type: object
      required: [needsBootstrap, needsOnboarding, memberships]
      properties:
        email: {type: string, format: email}
        needsBootstrap: {type: boolean}
        needsOnboarding: {type: boolean}
        onboardingStep:
          type: string
          description: >
            Onboarding is one step — naming the organization. `account` means the session has no tenant yet; `complete` is everything after. The former `product`, `identity` and `integrate` values are gone: the dashboard deleted those screens (frontend ADR 0058).

          enum: [account, complete]
        signupSource:
          type: string
          description: Partner or channel attribution stored on the tenant
        memberships:
          type: array
          items:
            type: object
            required: [tenantId, slug, name, role]
            properties:
              tenantId: {$ref: '#/components/schemas/AccountId'}
              slug: {type: string}
              name: {type: string}
              role: {type: string}
        liveReadiness:
          type: object
          description: >
            Whether the primary tenant can actually collect money: the UK Ltd sells for it once it admitted the Account (`GET /account/mor`), so `providerConnected` means admitted and `providers` is `["infi_stripe_uk"]` then. Re-read on every sync. Absent when the state could not be read — a provider lookup must never fail a login.

          required: [providerConnected, providers]
          properties:
            providerConnected: {type: boolean}
            providers:
              type: array
              description: Providers in the `connected` state, the same set charges route on.
              items: {type: string}
        mode:
          type: string
          enum: [sandbox, live]
          description: Which of the two deployments answered, so the dashboard need not be told at build time.
        environments:
          type: array
          description: >
            What THIS deployment can say about the caller, and only that: sandbox answers ["sandbox"], live answers ["production"]. Neither computes the union — sandbox cannot read the live database and there is deliberately no cross-deployment call — so a client assembles it by calling the other host, where 403 is the answer "not granted".


            Never read from a token claim. Both deployments share one CIAM instance, so a claim travels to both hosts and would BE production access; the grant is a membership row in the database the request landed on.

          items: {type: string, enum: [sandbox, production]}
        termsVersion:
          type: string
          description: >
            Live only, and only while `needsBootstrap` is true: the Infi Terms version the first live login must accept. Show that version and send it back as `acceptedTermsVersion` on `POST /auth/session/bootstrap`.

    WebhookEndpoint:
      type: object
      required: [id, url, events, isActive, createdAt]
      properties:
        id: {$ref: '#/components/schemas/WebhookEndpointId'}
        url: {type: string, format: uri}
        events:
          type: array
          description: >
            Subscribed event types. Not constrained to WebhookEventType: dispatch matches on `event_type = ANY(events)` with no allowlist, so any event the outbox emits is subscribable. WebhookEventType documents the ones with a described payload.

          items: {type: string}
        isActive: {type: boolean}
        createdAt: {type: string, format: date-time}
    CreatedWebhookEndpoint:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          properties:
            secret:
              type: string
              description: HMAC signing secret, returned only once at creation.
    WebhookDelivery:
      type: object
      required: [id, eventType, eventId, status, attempts, createdAt]
      properties:
        id: {type: string, format: uuid}
        endpointId: {oneOf: [{$ref: '#/components/schemas/WebhookEndpointId'}, {type: 'null'}]}
        eventType: {type: string}
        eventId: {type: string}
        status: {type: string, enum: [pending, sent, failed]}
        responseStatus: {type: [integer, "null"]}
        error: {type: [string, "null"]}
        attempts: {type: integer}
        createdAt: {type: string, format: date-time}
        sentAt: {type: [string, "null"], format: date-time}
    NotificationSubscription:
      type: object
      required: [id, eventType, channel, destination, active]
      properties:
        id: {type: string, format: uuid}
        eventType: {type: string}
        channel: {type: string, enum: [email, sms]}
        destination: {type: string}
        config: {type: object, additionalProperties: true}
        active: {type: boolean}
    ProductDraftContent:
      type: object
      properties:
        name: {type: string}
        description: {type: [string, "null"]}
        media:
          type: array
          items: {$ref: "#/components/schemas/ProductMedia"}
        faq:
          type: array
          items: {$ref: "#/components/schemas/ProductFAQ"}
        purchaseButtonText: {type: [string, "null"], maxLength: 40}
        postPurchaseRedirectUrl: {type: [string, "null"]}
        accentColor: {type: [string, "null"]}
        guaranteeDays: {type: integer, minimum: 7, maximum: 30}
    ProductDraftPricing:
      type: object
      properties:
        billingCycle: {type: [string, "null"], enum: [weekly, monthly, annual, null]}
        basePrice: {type: [string, "null"]}
    ProductDraft:
      type: object
      required: [content, pricing, savedAt, publishedVersion, createsVersion]
      properties:
        content: {$ref: "#/components/schemas/ProductDraftContent"}
        pricing: {$ref: "#/components/schemas/ProductDraftPricing"}
        savedAt: {type: [string, "null"], format: date-time, description: The last autosave; null when nothing is unpublished.}
        publishedVersion: {type: [integer, "null"], description: What buyers get now; null before the first publish.}
        createsVersion: {type: [integer, "null"], description: The version publishing would make live; null while the price equals the published one.}
    ProductMedia:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [image, video]}
        objectKey:
          type: string
          description: An image's key from `POST /catalog/images/presign` (this account's only). Absent on a video.
        url:
          type: string
          description: A video's https link on a write; on a read, also the image's derived address.
        alt: {type: string, maxLength: 200}
    ProductFAQ:
      type: object
      required: [question, answer]
      properties:
        question: {type: string, maxLength: 200}
        answer: {type: string, maxLength: 2000}
    Appearance:
      type: object
      description: >
        A buyer page's resolved look — values only. Resolved link → product → business → default (docs/product-specs/templates/dashboard-v1-api.md).

      required: [accentColor, backgroundColor, font, radius]
      properties:
        accentColor: {type: string, example: "#0A1430"}
        backgroundColor: {type: string, example: "#FFFFFF"}
        font: {$ref: "#/components/schemas/AppearanceFont"}
        radius: {$ref: "#/components/schemas/AppearanceRadius"}
    AppearanceFont:
      type: string
      enum: [system, inter, geist, roboto, poppins, lora]
    AppearanceRadius:
      type: string
      enum: [none, small, medium, large, full]
    BusinessAppearance:
      type: object
      description: >
        The business theme every product and link inherits. On a write, an absent field is left alone and "" clears it (back to the default).

      properties:
        accentColor: {type: [string, "null"], example: "#0F766E"}
        font: {type: [string, "null"], enum: [system, inter, geist, roboto, poppins, lora, "", null]}
        radius: {type: [string, "null"], enum: [none, small, medium, large, full, "", null]}
    LinkAppearance:
      type: object
      description: >
        A checkout link's own look: `accentColor` is its button. On a write, an absent field is left alone and "" clears it (inherit again).

      properties:
        accentColor: {type: [string, "null"], example: "#DC2626"}
        backgroundColor: {type: [string, "null"], example: "#111827"}
        font: {type: [string, "null"], enum: [system, inter, geist, roboto, poppins, lora, "", null]}
    AppearanceValue:
      type: object
      required: [value, source]
      properties:
        value: {type: string}
        source: {type: string, enum: [link, product, business, default]}
    AppearanceResolution:
      type: object
      required: [business, product, link, defaults, effective]
      properties:
        business: {$ref: "#/components/schemas/BusinessAppearance"}
        product:
          type: [object, "null"]
          properties:
            accentColor: {type: [string, "null"]}
        link:
          oneOf:
            - $ref: "#/components/schemas/LinkAppearance"
            - type: "null"
        defaults: {$ref: "#/components/schemas/Appearance"}
        effective:
          type: object
          required: [accentColor, backgroundColor, font, radius]
          properties:
            accentColor: {$ref: "#/components/schemas/AppearanceValue"}
            backgroundColor: {$ref: "#/components/schemas/AppearanceValue"}
            font: {$ref: "#/components/schemas/AppearanceValue"}
            radius: {$ref: "#/components/schemas/AppearanceValue"}
    CheckoutInteractionSnapshot:
      type: object
      description: >
        A checkout session as the agent contract reads it, at its public level (no contact: the session id travels in a URL, so it reaches referrers and logs). The browser reads the same document as an agent on purpose, so a page and an API never disagree about whether someone paid.

      required: [schemaVersion, interactionId, revision, consentDigest, status, requiredFields, actions, humanUrl]
      properties:
        schemaVersion: {type: string, example: "1"}
        interactionId: {type: string, format: uuid, description: The checkout session's id.}
        purchaseId:
          $ref: '#/components/schemas/InvoiceId'
          description: The invoice, once the first charge materialized it.
        payment:
          $ref: '#/components/schemas/Payment'
          description: The public card payment projection, when the Session-owned attempt is linked. Lets a reload resume after a lost submit response.
        revision:
          type: string
          example: r3
          description: Moves with every state change. Echo it on an action; a stale one is 409 `stale_revision`.
        consentDigest:
          type: string
          example: "sha256:9f2c"
          description: >
            Over what the buyer agrees to (who is paid, how much, in what currency, for what). Echo it on an action; a changed bargain is 409 `consent_changed`.

        unavailableReason:
          type: string
          description: Why this purchase cannot currently accept payment.
        status:
          type: string
          enum: [requires_input, requires_payment, payment_pending, paid, payment_unknown, expired, canceled, failed]
          description: >
            `payment_unknown` is a charge the provider never answered: keep asking, never charge again.

        total:
          type: object
          required: [amount, currency]
          properties:
            amount: {type: string, description: Decimal string.}
            currency: {type: string}
        requiredFields:
          type: array
          description: What the session still needs before a charge can be attempted.
          items: {type: string, enum: [email, name, taxId, buyerCountry]}
        actions:
          type: array
          nullable: true
          description: What the buyer may do next. Null when there is nothing to do (a charge in flight, a paid session).
          items: {$ref: "#/components/schemas/CheckoutAction"}
        nextPollAfterMs:
          type: integer
          description: How long to wait before reading again while a payment is in flight.
        codeChallenge:
          type: object
          description: Appears once a purchase code was sent. Never the code, nor the full destination.
          required: [challengeId, channel, maskedDestination]
          properties:
            challengeId: {type: string}
            channel: {type: string}
            maskedDestination: {type: string}
            expiresAt: {type: string}
        humanUrl: {type: string, description: The hosted page for the same link.}
    CheckoutAction:
      type: object
      required: [id, type, label, inputSchema]
      properties:
        id: {type: string, example: provide_contact}
        type: {type: string, enum: [provide_contact, request_purchase_code, confirm_code]}
        label: {type: string}
        inputSchema:
          type: object
          description: JSON Schema of the `input` the action takes.
          additionalProperties: true
    CheckoutActionRequest:
      type: object
      required: [actionId, revision, consentDigest]
      properties:
        actionId: {type: string, description: The `id` of an action the snapshot offered.}
        revision: {type: string, description: The snapshot's `revision`.}
        consentDigest: {type: string, description: The snapshot's `consentDigest`. Required, never optional when absent.: null}
        input:
          type: object
          description: What the action's `inputSchema` asks for.
          additionalProperties: {type: string}
    PortalOrder:
      type: object
      required: [id, status, currency, total, receiptUrl, lines, guarantee]
      properties:
        id: {$ref: '#/components/schemas/InvoiceId'}
        number: {type: string}
        status: {type: string}
        currency: {type: string}
        total: {type: string}
        paidAt: {type: string, format: date-time}
        receiptUrl: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, amount]
            properties:
              description: {type: string}
              quantity: {type: string}
              amount: {type: string}
        payment:
          type: object
          required: [id, method, status, amount, refundedAmount, refundPendingAmount]
          properties:
            id: {$ref: '#/components/schemas/PaymentId'}
            method: {type: string}
            status: {type: string}
            amount: {type: string}
            refundedAmount: {type: string}
            refundPendingAmount: {type: string}
        guarantee:
          type: object
          required: [days, endsAt, withinWindow]
          properties:
            days: {type: integer}
            endsAt: {type: string, format: date-time}
            withinWindow: {type: boolean}
        refundRequest: {$ref: "#/components/schemas/PortalRefundRequest"}
    PortalRefundRequest:
      type: object
      required: [id, status, withinWindow, createdAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, declined]}
        withinWindow: {type: boolean}
        decidedBy: {type: string, description: "`automatic`, or the store's actor."}
        note: {type: string}
        createdAt: {type: string, format: date-time}
    PortalCard:
      type: object
      properties:
        brand: {type: string}
        last4: {type: string}
        expMonth: {type: integer}
        expYear: {type: integer}
    PortalSubscription:
      type: object
      required: [id, productName, status, billingCycle, cancelAtPeriodEnd]
      properties:
        id: {$ref: '#/components/schemas/SubscriptionId'}
        productName: {type: string}
        status: {type: string}
        billingCycle: {type: string}
        nextBillingDate: {type: string, format: date-time}
        cancelAtPeriodEnd: {type: boolean}
        accessUntil: {type: string, format: date-time}
        canceledAt: {type: string, format: date-time}
        renewalAuthorization: {$ref: "#/components/schemas/PortalRenewalAuthorization"}
        card: {$ref: "#/components/schemas/PortalCard"}
        usage:
          type: array
          description: What the current period has used so far, per meter. Absent without meters.
          items: {$ref: "#/components/schemas/PortalUsageLine"}
        usageSince: {type: string, format: date-time, description: When the current period began.}
    PortalRenewalAuthorization:
      type: object
      additionalProperties: false
      required: [state, version, textVersion, amountMinor, currency, cadence]
      properties:
        state: {type: string, enum: [pending_first, active, revoked]}
        version: {type: integer, format: int64}
        textVersion: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        cadence: {type: string}
    PortalUsageLine:
      type: object
      required: [meter, unit, quantity]
      properties:
        meter: {type: string}
        unit: {type: string}
        quantity: {type: string, description: Decimal.}
        amount: {type: string, description: Decimal; the period's price so far, when priced.: null}
        currency: {type: string}
    PortalBalance:
      type: object
      required: [productName, meter, balance, consumedThisPeriod, consumedLastPeriod, periodStart]
      properties:
        productName: {type: string}
        meter: {type: string, description: "The balance's meter: credits, tokens…"}
        balance: {type: string, description: Decimal.}
        consumedThisPeriod: {type: string, description: "Decimal; units debited from this balance since the current period began."}
        consumedLastPeriod: {type: string, description: "Decimal; units debited from this balance in the previous period."}
        periodStart: {type: string, format: date-time, description: "When the current period began. Periods are calendar months in UTC."}
        buyUrl: {type: string, description: "Path of the public checkout where the buyer can buy more of this balance: /pay/{slug}/links/{token}, the store's active link to a credit package granting this meter. Absent when the store sells none."}
    PortalServiceUsePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PortalServiceUse"}
        nextCursor: {type: [string, "null"]}
    PortalServiceUse:
      type: object
      additionalProperties: false
      required: [id, productName, serviceName, unit, quantity, usedAt, correctedAt]
      properties:
        id: {type: string, format: uuid, description: Opaque stable service-use fact ID.}
        productName: {type: string}
        serviceName: {type: string}
        unit: {type: string}
        quantity: {type: string, description: Decimal.}
        usedAt: {type: string, format: date-time}
        correctedAt: {type: [string, "null"], format: date-time, description: When the use was corrected; null if not corrected.}
    PortalOpenInvoice:
      type: object
      required: [id, description, currency, total, amountDue, payUrl]
      properties:
        id: {$ref: '#/components/schemas/InvoiceId'}
        number: {type: string}
        description: {type: string}
        currency: {type: string}
        total: {type: string, description: Decimal.}
        amountDue: {type: string, description: Decimal.}
        dueDate: {type: string, format: date-time}
        payUrl: {type: string, description: "Path of the public checkout for this invoice: /pay/{slug}/invoices/{id}."}
    PortalDownload:
      type: object
      required: [id, productName, kind, revoked]
      properties:
        id: {type: string, format: uuid}
        productName: {type: string}
        kind: {type: string, enum: [file, link]}
        fileName: {type: string}
        orderId: {$ref: '#/components/schemas/InvoiceId'}
        url: {type: string, description: "Absent when revoked."}
        revoked: {type: boolean}
        revokedReason: {type: string}
        revokedAt: {type: string, format: date-time}
    PortalPaymentMethod:
      type: object
      description: A card the buyer keeps at this store; brand, last4 and expiry are absent when the provider did not describe it.
      required: [id, provider, isDefault]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, example: infi_stripe_uk}
        brand: {type: string}
        last4: {type: string}
        expMonth: {type: integer}
        expYear: {type: integer}
        isDefault: {type: boolean}
    PortalSession:
      type: object
      required: [origin, scope, expiresAt, actionsNeedCode, actionsPermitted]
      properties:
        origin: {type: string, enum: [code, merchant]}
        scope: {type: string, enum: ["portal:read", "portal:write"]}
        maskedEmail: {type: string}
        expiresAt: {type: string, format: date-time}
        actionsNeedCode: {type: boolean}
        actionsPermitted: {type: boolean}
    PortalCodeVerify:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: {type: string, format: uuid}
        code: {type: string, pattern: "^[0-9]{6}$"}
    CLIProject:
      type: object
      required: [projectId]
      properties:
        projectId: {type: string, maxLength: 128, description: The CLI's stable id for this project.}
        projectName: {type: string, maxLength: 80}
        machine: {type: string, maxLength: 80}
    AccessKey:
      type: object
      required: [id, key, name, createdAt]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
    AccessRule:
      type: object
      required: [key, window]
      properties:
        key: {type: string}
        name: {type: string, readOnly: true}
        window: {type: string, enum: [lifetime, subscription, days]}
        days: {type: integer, minimum: 1, description: Required for `days`.}
    AccessGrant:
      type: object
      required: [id, key, keyName, customerId, source, window, startsAt, createdAt, state]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        keyName: {type: string}
        customerId: {$ref: '#/components/schemas/CustomerId'}
        source: {type: string, enum: [purchase, manual]}
        window: {type: string, enum: [lifetime, subscription, days]}
        startsAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        subscriptionId: {$ref: '#/components/schemas/SubscriptionId'}
        subscriptionStatus: {type: string}
        productId: {$ref: '#/components/schemas/ProductId'}
        invoiceId: {$ref: '#/components/schemas/InvoiceId'}
        paymentId: {$ref: '#/components/schemas/PaymentId'}
        reason: {type: string}
        revokedAt: {type: string, format: date-time}
        revokedReason: {type: string, enum: [refunded, charged_back, manual]}
        createdAt: {type: string, format: date-time}
        state: {type: string, enum: [active, past_due, ended]}
    KeyAccess:
      type: object
      required: [key, name, hasAccess, state, grants]
      description: >
        One key as a person holds it, every grant folded. `past_due` still has access, with a warning. `since` is when the earliest live grant started.

      properties:
        key: {type: string}
        name: {type: string}
        hasAccess: {type: boolean}
        state: {type: string, enum: [active, past_due, ended]}
        since: {type: string, format: date-time}
        until: {type: string, format: date-time, description: Absent for lifetime or while a subscription keeps it.}
        endedReason:
          type: string
          description: expired, refunded, charged_back, manual, or subscription_<status>.
        grants: {type: array, items: {$ref: "#/components/schemas/AccessGrant"}}
    CommunityIntegration:
      type: object
      required: [id, provider, accessKey, externalId, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, enum: [telegram, discord]}
        accessKey: {type: string}
        externalId: {type: string, description: Telegram chat id or Discord guild id.}
        roleId: {type: string}
        inviteUrl: {type: string}
        title: {type: string}
        status: {type: string, enum: [active, disabled]}
        createdAt: {type: string, format: date-time}
    TeamRole:
      type: string
      enum:
        - owner
        - admin
        - readonly
      description: Fixed merchant role. Only owners manage the team and credentials. Admins perform ordinary business writes; readonly sessions cannot perform business writes. Existing stronger owner and MFA guards remain in effect.
    TeamMember:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
      properties:
        id: &a1
          type: string
          format: uuid
        email:
          type: string
          format: email
        role: &a2
          $ref: "#/components/schemas/TeamRole"
        createdAt: &a3
          type: string
          format: date-time
    TeamInvitation:
      type: object
      required:
        - id
        - email
        - role
        - status
        - createdAt
        - expiresAt
      properties:
        id: *a1
        email:
          type: string
          format: email
        role: *a2
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        createdAt: *a3
        expiresAt: *a3
        emailSentAt:
          type: string
          format: date-time
          nullable: true
    TeamView:
      type: object
      required:
        - members
        - invitations
        - currentUserId
        - canManage
        - mode
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/TeamInvitation"
        currentUserId: *a1
        canManage:
          type: boolean
        mode: &a5
          type: string
          enum:
            - sandbox
            - live
    TeamTenant:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id: &a4
          type: string
        slug: *a4
        name: *a4
    TeamInvitationPreview:
      type: object
      required:
        - invitation
        - tenant
        - mode
      properties:
        invitation:
          type: object
          required:
            - id
            - email
            - role
            - status
            - expiresAt
          properties:
            id: *a1
            email:
              type: string
              format: email
            role: *a2
            status:
              type: string
              enum:
                - pending
                - accepted
                - revoked
                - expired
            expiresAt: *a3
        tenant:
          $ref: "#/components/schemas/TeamTenant"
        mode: *a5
        termsVersion:
          type: string
    TeamInvitationAcceptance:
      type: object
      required:
        - tenant
        - user
        - mode
      properties:
        tenant:
          $ref: "#/components/schemas/TeamTenant"
        user:
          type: object
          required:
            - id
            - email
            - role
          properties:
            id: *a1
            email:
              type: string
              format: email
            role: *a2
        mode: *a5
    AIAssistantTenant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
      required:
        - id
        - slug
        - name
    AIAssistantResource:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - business
            - product
            - offer
            - checkout
            - customer
            - receiving
            - kyc
            - catalog_revision
        id:
          type: string
        url:
          type: string
        path:
          type: string
        tenant:
          $ref: "#/components/schemas/AIAssistantTenant"
      required:
        - kind
        - id
    AIAssistantPart:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - text
            - resource
            - operation
            - interaction
            - plan
        text:
          type: string
        lines:
          type: array
          items:
            type: string
          description: For a plan part, the changes that are not products (meters, webhooks), as the plan's own sentences.
        blocked:
          type: boolean
          description: For a plan part, whether the plan has a change that cannot be applied.
        items:
          type: array
          description: For a plan part, each product the plan touches, for the confirmation card.
          items:
            type: object
            required: [key, name, status, currency, staying]
            properties:
              key:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [new, price, update, archive]
              price:
                type: string
                description: Base price of the version to be published, decimal in major units.
              currency:
                type: string
              cycle:
                type: string
                enum: [weekly, monthly, annual]
              staying:
                type: integer
                format: int64
                description: Subscribers who keep paying the version they agreed to.
        resource:
          $ref: "#/components/schemas/AIAssistantResource"
        summary:
          type: string
        operationId:
          type: string
        interactionId:
          type: string
        state:
          type: string
          description: Actual command operation state, independent of assistant run completion.
      required:
        - kind
    AIAssistantEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Public id with its prefix (conv_, msg_, run_, draft_, ADR 0015); a bare UUID is still accepted on input.
        sequence:
          type: integer
          format: int64
        author:
          type: string
          enum:
            - user
            - assistant
            - system
        parts:
          type: array
          items:
            $ref: "#/components/schemas/AIAssistantPart"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sequence
        - author
        - parts
        - createdAt
    AIAssistantError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        retryable:
          type: boolean
      required:
        - code
        - retryable
    AIAssistantRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Public id with its prefix (conv_, msg_, run_, draft_, ADR 0015); a bare UUID is still accepted on input.
        state:
          type: string
          enum:
            - queued
            - running
            - waiting_user
            - completed
            - failed
            - cancelled
        error:
          allOf:
            - $ref: "#/components/schemas/AIAssistantError"
          nullable: true
        operations:
          type: array
          items:
            $ref: "#/components/schemas/AIAssistantPart"
          description: Persisted command outcomes, including results admitted before run cancellation.
      required:
        - id
        - state
        - error
    AIAssistantNextAction:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - web
        path:
          type: string
      required:
        - kind
        - path
    AIAssistantInteraction:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        purpose:
          type: string
        state:
          type: string
          enum:
            - pending
            - completed
            - expired
            - cancelled
        summary:
          type: string
        contentHash:
          type: string
        basisRevision:
          type: string
        expiresAt:
          type: string
          format: date-time
        nextAction:
          $ref: "#/components/schemas/AIAssistantNextAction"
      required:
        - id
        - purpose
        - state
        - summary
        - contentHash
        - basisRevision
        - expiresAt
        - nextAction
    AIAssistantConversationSummary:
      type: object
      required: [id, title, tenant, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Public id with its prefix (conv_, msg_, run_, draft_, ADR 0015); a bare UUID is still accepted on input.
        title:
          type: string
          description: Start of the first message the caller sent; empty before the first message.
        tenant:
          oneOf:
            - $ref: "#/components/schemas/AIAssistantTenant"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AIAssistantConversationList:
      type: object
      required: [conversations, total]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/AIAssistantConversationSummary"
        total:
          type: integer
          format: int64
    AIAssistantConversation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Public id with its prefix (conv_, msg_, run_, draft_, ADR 0015); a bare UUID is still accepted on input.
        environment:
          type: string
          enum:
            - sandbox
            - live
        tenant:
          allOf:
            - $ref: "#/components/schemas/AIAssistantTenant"
          nullable: true
        version:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AIAssistantEntry"
        activeRun:
          allOf:
            - $ref: "#/components/schemas/AIAssistantRun"
          nullable: true
        interactions:
          type: array
          items:
            $ref: "#/components/schemas/AIAssistantInteraction"
        capabilities:
          type: object
          additionalProperties: false
          properties:
            canSend:
              type: boolean
            modelAvailable:
              type: boolean
          required:
            - canSend
            - modelAvailable
      required:
        - id
        - environment
        - tenant
        - version
        - entries
        - activeRun
        - interactions
        - capabilities
    CreateAIAssistantConversationInput:
      type: object
      additionalProperties: false
      properties:
        draft:
          type: string
          maxLength: 4096
        title:
          type: string
          maxLength: 120
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    SubmitAIAssistantEntryInput:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4096
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - content
        - idempotencyKey
    AIAssistantConversationResult:
      type: object
      additionalProperties: false
      properties:
        conversation:
          $ref: "#/components/schemas/AIAssistantConversation"
      required:
        - conversation
    AIAssistantTurnResult:
      type: object
      additionalProperties: false
      properties:
        run:
          $ref: "#/components/schemas/AIAssistantRun"
        conversation:
          $ref: "#/components/schemas/AIAssistantConversation"
      required:
        - run
        - conversation
    CreateAIAssistantDraftInput:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4096
        environment:
          type: string
          enum:
            - sandbox
            - live
      required:
        - content
        - environment
    AIAssistantDraft:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Public id with its prefix (conv_, msg_, run_, draft_, ADR 0015); a bare UUID is still accepted on input.
        capability:
          type: string
          minLength: 43
          maxLength: 43
          description: Browser-only capability returned once. Never put in model context, ordinary telemetry or URL query parameters.
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - capability
        - expiresAt
    DelegatedAccessGrant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
        environment:
          type: string
          enum:
            - sandbox
            - live
        resource:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - pending
            - active
            - cancelled
            - expired
            - revoked
        expiresAt:
          type: string
          format: date-time
        tenantId:
          type: string
        membershipId:
          type: string
          format: uuid
        policyVersion:
          type: integer
      required:
        - id
        - clientId
        - environment
        - resource
        - scopes
        - status
        - expiresAt
        - policyVersion
    DelegatedAccessConsentInput:
      type: object
      additionalProperties: false
      properties:
        scopes:
          type: array
          items:
            type: string
        policyVersion:
          type: integer
          enum:
            - 1
      required:
        - scopes
        - policyVersion

name: Slack - PR aberto

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  notify:
    # Draft nao avisa: ready_for_review dispara quando sair de draft.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Avisar no Slack
        env:
          # Secret de org; um secret com o mesmo nome no repo sobrescreve -> canal por repo.
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_PR }}
          # Opcional: variable de org com {"login-github": "U0123SLACK"} pra marcar reviewer.
          USER_MAP: ${{ vars.SLACK_USER_MAP }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers) }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::SLACK_WEBHOOK_PR nao configurado - pulando o aviso."
            exit 0
          fi
          case "${USER_MAP}" in ""|null) USER_MAP='{}' ;; esac
          case "${REVIEWERS}" in ""|null) REVIEWERS='[]' ;; esac

          payload=$(jq -n \
            --arg repo "$REPO" --arg num "$NUMBER" --arg title "$TITLE" \
            --arg url "$URL" --arg author "$AUTHOR" \
            --arg head "$HEAD_REF" --arg base "$BASE_REF" \
            --argjson reviewers "$REVIEWERS" --argjson usermap "$USER_MAP" '
              def slack: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
              def mention: if $usermap[.] then "<@" + $usermap[.] + ">" else . end;
              ($reviewers | map(.login | mention)) as $revs |
              {
                text: ("Novo PR em " + $repo + ": #" + $num + " " + $title),
                blocks: [
                  { type: "section", text: { type: "mrkdwn", text:
                      ("*<" + $url + "|#" + $num + " - " + ($title | slack) + ">*\n`" + $repo + "`") } },
                  { type: "context", elements: [ { type: "mrkdwn", text:
                      ("por *" + $author + "* - `" + $head + "` -> `" + $base + "`"
                       + (if ($revs | length) > 0 then " - review: " + ($revs | join(", ")) else "" end)) } ] }
                ]
              }')

          curl -sS -f -X POST -H 'Content-type: application/json' \
            --data "$payload" "$WEBHOOK" > /dev/null
          echo "Aviso enviado: #${NUMBER} ${REPO}"

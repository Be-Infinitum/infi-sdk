name: ci

# The package is generated from the contract (ADR 0055). This workflow proves three things:
#   1. src/generated/ is exactly what the generator produces from api/openapi.sdk.json;
#   2. types, transport tests and the build pass;
#   3. the examples run against the real sandbox, never against a fake fetch
#      (ADR 0055, D7.4). Without the secret, step 3 fails: there is no "passed" without a backend.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: src/generated/ matches the contract
        run: bun run check:generated
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  sandbox:
    # The examples are the suite against the real backend. A PR from a fork does
    # not receive the secret; in that case the reviewer runs the workflow by hand after the merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: generated-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      # Only one sandbox account: two simultaneous runs would apply config
      # documents on top of each other.
      group: sandbox-examples
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Examples against api-sandbox.beinfi.com
        env:
          INFI_SECRET_KEY: ${{ secrets.INFI_SANDBOX_SECRET_KEY }}
        run: bun run examples

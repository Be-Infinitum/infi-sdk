name: publish

# Publishes @beinfi/sdk to npm. Manual only: the version comes from package.json and the
# dist-tag is chosen at run time (`next` to try 1.x without moving `latest`).
# Authenticates through trusted publishing (OIDC): the package on npmjs.com must list this
# repository and this workflow as a trusted publisher. There is no NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (next or latest)"
        required: true
        default: next
        type: choice
        options: [next, latest]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check:generated
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Examples against the sandbox before publishing
        env:
          INFI_SECRET_KEY: ${{ secrets.INFI_SANDBOX_SECRET_KEY }}
        run: bun run examples
      - run: npm publish --provenance --access public --tag "${{ inputs.dist_tag }}"
